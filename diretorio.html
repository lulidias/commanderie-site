<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diretório de Membros — Commanderie de Bordeaux</title>
<style>
:root{--parch:#f3ecd9;--parch2:#ece3cd;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;font-size:13px;color:var(--red);text-decoration:none;cursor:pointer;}
.dhead{text-align:center;padding:40px 20px 6px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:36px;margin:6px 0 2px;}
.wrap{max-width:1000px;margin:0 auto;padding:14px 20px 60px;}
.sec-title{font-family:Georgia,serif;color:var(--navy);font-size:22px;font-weight:normal;margin:30px 0 4px;}
.sec-rule{height:1px;background:var(--line);margin:0 0 16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{display:flex;align-items:center;gap:14px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--gold-l);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:18px;border:1px solid var(--gold);overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.info{min-width:0;}
.info b{display:block;font-family:Georgia,serif;color:var(--navy);font-weight:normal;font-size:16px;line-height:1.2;}
.nuc{font-size:12.5px;color:var(--red);margin-top:2px;}
.meta{font-size:11.5px;color:#9a8f72;letter-spacing:.5px;margin-top:3px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
.dfoot{text-align:center;padding:28px 20px;background:var(--navy);color:#cdbf9a;}
.dfoot .m{font-family:Georgia,serif;font-style:italic;color:#e7d8a8;}
</style></head><body>
<div class="dtop"><img src="img/brasao.png" alt="Brasão"><b>Diretório de Membros</b><a class="back" href="index.html">← Área do Membro</a></div>
<div id="needLogin" class="state" style="display:none;">
  <h2>Diretório restrito aos membros</h2>
  <p>Entre na sua conta para ver o diretório da confraria.</p>
  <a class="btn" href="index.html">Entrar</a>
</div>
<div id="loading" class="state">Carregando diretório…</div>
<div id="dir" style="display:none;">
  <div class="dhead"><div class="k">Confraria</div><h1>Diretório de Membros</h1></div>
  <div class="wrap" id="wrap"></div>
</div>
<div class="dfoot"><div class="m">“Bordeaux, toujours Bordeaux”</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var DESDE={1:"11/2025",2:"12/2025",3:"03/2026",4:"03/2026",5:"04/2026"};
function ini(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"")).toUpperCase();}
function avatar(m){if(m.foto_url)return '<span class="av"><img src="'+m.foto_url+'"></span>';return '<span class="av">'+ini(m.nome)+'</span>';}
function card(m){
  var d=DESDE[m.capitulo];
  var meta=(m.codigo||"")+(d?(" · Desde "+d):"");
  var nuc=m.nucleo?('<div class="nuc">'+m.nucleo+'</div>'):"";
  return '<div class="card">'+avatar(m)+'<div class="info"><b>'+m.nome+'</b>'+nuc+(meta?('<div class="meta">'+meta+'</div>'):"")+'</div></div>';
}
function grupo(titulo,itens){
  if(!itens.length)return "";
  var cards=itens.map(function(m){return card(m);}).join("");
  return '<div class="sec-title">'+titulo+'</div><div class="sec-rule"></div><div class="grid">'+cards+'</div>';
}
function rank(g){g=(""+g).toLowerCase();if(g.indexOf("grão")>=0||g.indexOf("grao")>=0)return 0;if(g.indexOf("mestre")>=0)return 1;return 2;}
async function carregar(){
  var u=(await sb.auth.getUser()).data.user;
  if(!u){document.getElementById("loading").style.display="none";document.getElementById("needLogin").style.display="block";return;}
  var q=await sb.from("diretorio").select("*");
  document.getElementById("loading").style.display="none";
  if(q.error){document.getElementById("needLogin").style.display="block";document.getElementById("needLogin").querySelector("p").textContent="Não foi possível carregar ("+q.error.message+").";return;}
  var rows=q.data||[];
  var mestres=[],comend=[],honra=[];
  rows.forEach(function(m){var g=(""+(m.grau||"")).toLowerCase();if(g.indexOf("honra")>=0)honra.push(m);else if(g.indexOf("mestre")>=0)mestres.push(m);else comend.push(m);});
  mestres.sort(function(a,b){return rank(a.grau)-rank(b.grau)||a.nome.localeCompare(b.nome);});
  comend.sort(function(a,b){return (a.codigo||"").localeCompare(b.codigo||"");});
  honra.sort(function(a,b){return a.nome.localeCompare(b.nome);});
  document.getElementById("wrap").innerHTML=grupo("Mestres",mestres)+grupo("Comendadores",comend)+grupo("Membros de Honra",honra);
  document.getElementById("dir").style.display="block";
}
document.addEventListener("DOMContentLoaded",carregar);
</script></body></html>
