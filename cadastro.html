<script>

async function uploadFotoSeNova(){if(!fotoNova||!fImg||fImg.style.display==="none")return null;var scale=fBase*fZoom,OUT=320;var cv=document.createElement("canvas");cv.width=OUT;cv.height=OUT;var cx=cv.getContext("2d");cx.drawImage(fImg,(0-fOX)/scale,(0-fOY)/scale,fotoV/scale,fotoV/scale,0,0,OUT,OUT);var blob=await new Promise(function(res){cv.toBlob(res,"image/jpeg",0.9);});var u=(await sb.auth.getUser()).data.user;if(!u)return null;var path=u.id+".jpg";var up=await sb.storage.from("fotos").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(up.error)throw up.error;return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;}
function fotoApply(){var dw=fNW*fBase*fZoom,dh=fNH*fBase*fZoom;if(fOX>0)fOX=0;if(fOY>0)fOY=0;if(fOX<fotoV-dw)fOX=fotoV-dw;if(fOY<fotoV-dh)fOY=fotoV-dh;fImg.style.width=dw+"px";fImg.style.height=dh+"px";fImg.style.left=fOX+"px";fImg.style.top=fOY+"px";}

async function salvarCadastro(){var o=document.getElementById("cadOk");var nome=document.getElementById("cadNome").value.trim();if(!nome){o.style.color="#8f1d24";o.textContent="O nome não pode ficar vazio.";return;}if(!document.getElementById("cadNascimento").value){o.style.color="#8f1d24";o.textContent="Informe a sua data de nascimento.";return;}o.style.color="#2f6b3a";o.textContent="Salvando...";var g=function(id){var e=document.getElementById(id);return e?e.value.trim():null;};var payload={nome:nome,telefone_ddi:g("cadDDI"),telefone:g("cadTelefone"),nascimento:g("cadNascimento")||null,documento:g("cadDoc"),endereco:g("cadEndereco"),bairro:g("cadBairro"),cidade:g("cadCidade"),cep:g("cadCEP"),pais:g("cadPais")};var u=(await sb.auth.getUser()).data.user;if(!u){o.style.color="#8f1d24";o.textContent="Sessão expirada. Faça login novamente.";return;}try{var furl=await uploadFotoSeNova();if(furl)payload.foto_url=furl;}catch(e){o.style.color="#8f1d24";o.textContent="Erro ao enviar a foto: "+(e.message||e);return;}var r=await sb.from("membros").update(payload).eq("user_id",u.id);if(r.error){o.style.color="#8f1d24";o.textContent="Erro ao salvar: "+r.error.message;return;}for(var k in payload){membroAtual[k]=payload[k];}o.style.color="#2f6b3a";o.textContent="Cadastro salvo!";fotoPrepEdit();}
async function carregar(){var u=(await sb.auth.getUser()).data.user;document.getElementById("loading").style.display="none";if(!u){document.getElementById("needLogin").style.display="block";return;}var q=await sb.from("membros").select("*").eq("user_id",u.id).maybeSingle();if(q.error||!q.data){document.getElementById("needLogin").style.display="block";return;}membroAtual=q.data;var m=q.data;var V=function(id,val){var e=document.getElementById(id);if(e)e.value=(val==null?"":val);};V("cadNome",m.nome);V("cadEmail",m.email);V("cadNascimento",m.nascimento);V("cadDoc",m.documento);V("cadEndereco",m.endereco);V("cadBairro",m.bairro);V("cadCidade",m.cidade);V("cadCEP",m.cep);V("cadPais",m.pais||"Brasil");if(m.telefone_ddi){var dd=document.getElementById("cadDDI");if(dd)dd.value=m.telefone_ddi;}V("cadTelefone",m.telefone);document.getElementById("content").style.display="block";fotoInit();fotoPrepEdit();}

</script>
