<style>

.res{background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.res h3{margin:0 0 8px;font-family:Georgia,serif;font-weight:normal;font-size:18px;color:#f3e3bd;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://yvdkaycwtulqjnvlpgvy.supabase.co","sb_publishable_v3QZOo0NYLpOAk9p5JBNjQ_r0vb-Zjd");
var SIMS=[],ADEGA=[],MEMB=[],CUR=null,S=null,SUJO=false;
var CATS={mp:"Membro (paga)",cp:"Convidado (paga)",mc:"Membro / Conselho (não paga)",cc:"Convidado de cortesia (não paga)"};
var CUSTOS_PADRAO=[["Gráfica (convites, menus, cartões)","fixo"],["Material de comunicação","fixo"],["Locação de material (taças, mesas, toalhas)","fixo"],["Flores e decoração","fixo"],["Músico","fixo"],["Fotógrafo","fixo"],["Transporte / frete dos vinhos","fixo"],["Taxa de rolha / serviço de sommelier","fixo"],["Brindes, medalhas e diplomas","fixo"]];
function novoS(){return {kind:"evento",status:"simulacao",titulo:"",data:"",local:"",tipo:"Jantar",rest_modo:"pessoa",preco_pessoa:0,rest_total:0,servico_pct:10,p:{mp:20,cp:5,mc:4,cc:2},ar:{mp:0,cp:0},vinhos:[],custos:CUSTOS_PADRAO.map(function(c){return {nome:c[0],valor:0,modo:c[1]};}),imprevistos_pct:5,valor_membro:0,valor_convidado:0,arred:10,receitas:[],lista:[],obs:""};}
function novoC(){return {kind:"consolidado",titulo:"",subtitulo:"",data:"",ids:[],ajustes:[],obs:""};}
function isCons(){return S&&S.kind==="consolidado";}
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(v){if(typeof v==="number")return v;v=(""+(v||"")).trim();if(!v)return 0;var neg=/^[-−]/.test(v);v=v.replace(/^[-−+]\s*/,"");if(v.indexOf(",")>=0)v=v.replace(/\./g,"").replace(",",".");var n=Number(v)||0;return neg?-n:n;}
function brl(n){return "R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function v2(n){return (Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function sbrl(n){n=Number(n)||0;return (n<0?"− ":(n>0?"+ ":""))+brl(Math.abs(n));}
function brl0(n){return "R$ "+Math.round(Number(n)||0).toLocaleString("pt-BR");}
function fv(n){n=Number(n)||0;return n?n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";}
function fdat(d){return d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";}
function cap1(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function arred(v,a){a=a||10;return Math.ceil((v-0.0001)/a)*a;}
// ---------- cálculo ----------
function calc(X){X=X||S;var p=X.p,ar=X.ar||{mp:0,cp:0};var mp=p.mp||0,cp=p.cp||0,P=mp+cp+(p.mc||0)+(p.cc||0),pag=mp+cp;
  var fech=X.rest_modo==="fechado";var porPessoaRest=fech?0:num(X.preco_pessoa)*(1+num(X.servico_pct)/100);
  var rest=fech?num(X.rest_total):porPessoaRest*P;
  var vin=0,garr=0;(X.vinhos||[]).forEach(function(v){garr+=v.qtd||0;if(!v.pago)vin+=(v.qtd||0)*num(v.preco);});
  var fixos=0,porPes=0;(X.custos||[]).forEach(function(c){if(c.modo==="pessoa")porPes+=num(c.valor);else fixos+=num(c.valor);});
  var outros=fixos+porPes*P;
  var sub=rest+vin+outros;var impr=sub*num(X.imprevistos_pct)/100;var total=sub+impr;
  var f=1+num(X.imprevistos_pct)/100;var custoVar=(porPessoaRest+porPes)*f;var custoFixo=((fech?rest:0)+vin+fixos)*f;
  var Ro=0,Ror=0;(X.receitas||[]).forEach(function(r){Ro+=num(r.valor);if(r.recebido)Ror+=num(r.valor);});
  var vc=num(X.valor_convidado),vm=num(X.valor_membro),a=num(X.arred)||1;
  var arm=Math.min(ar.mp||0,mp),arc=Math.min(ar.cp||0,cp);
  var arrec=mp*vm+cp*vc+Ro;var arrecReal=(mp-arm)*vm+(cp-arc)*vc+Ror;
  var igual=pag?(total-Ro)/pag:0;var nec=mp?(total-cp*vc-Ro)/mp:0;
  var minM=null;if(vm>custoVar){minM=Math.max(0,Math.ceil((custoFixo+custoVar*(cp+(p.mc||0)+(p.cc||0))-cp*vc-Ro)/(vm-custoVar)));}
  return {P:P,pag:pag,mp:mp,cp:cp,arm:arm,arc:arc,fech:fech,rest:rest,porPessoaRest:porPessoaRest,vin:vin,garr:garr,fixos:fixos,porPes:porPes,outros:outros,sub:sub,impr:impr,total:total,porPessoa:P?total/P:0,igual:igual,nec:nec,Ro:Ro,Ror:Ror,arrec:arrec,arrecReal:arrecReal,resultado:arrec-total,resultadoReal:arrecReal-total,minM:minM,custoVar:custoVar,ar:a,vm:vm,vc:vc,real:X.status==="realizado"};}
// linhas de despesas / recebimentos (usadas na tela e na impressão)
function linhasEvento(X){var C=calc(X),D=[],R=[],AR=[];
  D.push([esc(X.tipo||"Restaurante")+(C.fech?"":(" ("+C.P+" × "+brl(C.porPessoaRest).replace("R$ ","R$ ")+")")),C.rest]);
  var vs=(X.vinhos||[]).filter(function(v){return v.qtd&&!v.pago;});if(vs.length===1)D.push(["Vinhos · "+esc(vs[0].nome||"")+" ("+vs[0].qtd+" gf)",C.vin]);else if(vs.length)D.push(["Vinhos ("+vs.reduce(function(t,v){return t+v.qtd;},0)+" garrafas)",C.vin]);
  (X.custos||[]).forEach(function(c){if(num(c.valor))D.push([esc(c.nome)+(c.modo==="pessoa"?(" ("+C.P+" × "+brl(num(c.valor))+")"):""),c.modo==="pessoa"?num(c.valor)*C.P:num(c.valor)]);});
  if(C.impr)D.push(["Reserva para imprevistos ("+num(X.imprevistos_pct)+"%)",C.impr]);
  if(C.real){if(C.mp-C.arm)R.push([esc(X.rot_m||"Membros")+" ("+(C.mp-C.arm)+" × "+brl(C.vm)+")",(C.mp-C.arm)*C.vm]);if(C.cp-C.arc)R.push(["Convidados ("+(C.cp-C.arc)+" × "+brl(C.vc)+")",(C.cp-C.arc)*C.vc]);
    (X.receitas||[]).forEach(function(r){if(num(r.valor)&&r.recebido)R.push([esc(r.nome),num(r.valor)]);});
    if(C.arm)AR.push(["A receber ("+esc((X.rot_m||"membro").toLowerCase().replace(/s$/,""))+""+(C.arm>1?(" · "+C.arm+" × "+brl(C.vm)):"")+")",C.arm*C.vm]);if(C.arc)AR.push(["A receber (convidado"+(C.arc>1?(" · "+C.arc+" × "+brl(C.vc)):"")+")",C.arc*C.vc]);
    (X.receitas||[]).forEach(function(r){if(num(r.valor)&&!r.recebido)AR.push([esc(r.nome),num(r.valor)]);});}
  else{if(C.mp)R.push([esc(X.rot_m||"Membros")+" ("+C.mp+" × "+brl(C.vm)+")",C.mp*C.vm]);if(C.cp)R.push(["Convidados ("+C.cp+" × "+brl(C.vc)+")",C.cp*C.vc]);(X.receitas||[]).forEach(function(r){if(num(r.valor))R.push([esc(r.nome),num(r.valor)]);});}
  return {C:C,D:D,R:R,AR:AR};}
// ---------- carregar ----------
async function init(){var u=(await sb.auth.getUser()).data.user;if(!u){document.getElementById("st").innerHTML="Entre na sua conta do Conselho. <a href='index.html?login=1'>Entrar</a>";return;}
  var q=await sb.from("evento_simulacoes").select("*").order("updated_at",{ascending:false});
  if(q.error){document.getElementById("st").innerHTML="Rode o SQL <b>evento_simulacoes.sql</b> no Supabase. ("+esc(q.error.message)+")";return;}
  SIMS=q.data||[];
  var a=await sb.from("adega_vinhos").select("*").order("ordem",{ascending:true});var ai=await sb.from("adega_saida_itens").select("vinho_id,qtd");
  if(!a.error){var sd={};(ai.data||[]).forEach(function(i){sd[i.vinho_id]=(sd[i.vinho_id]||0)+i.qtd;});ADEGA=(a.data||[]).map(function(v){v.est=(Number(v.adquirido)||0)-(sd[v.id]||0);return v;}).filter(function(v){return v.est>0;});}
  var m=await sb.from("membros").select("nome").order("nome",{ascending:true});MEMB=(m.data||[]).map(function(x){return x.nome;}).filter(Boolean);
  document.getElementById("dlMemb").innerHTML=MEMB.map(function(n){return "<option value=\""+esc(n)+"\">";}).join("");
  document.getElementById("st").style.display="none";document.getElementById("app").style.display="block";
  var id=new URLSearchParams(location.search).get("id");
  if(id&&SIMS.some(function(x){return x.id===id;}))abrirSim(id);else if(SIMS.length)abrirSim(SIMS[0].id);else novaSim(true);}
function rotulo(x){var d=x.dados||{};var k=d.kind==="consolidado"?"📑 ":(d.status==="realizado"?"✔ ":"🧮 ");return k+(x.titulo||"Sem título")+(x.data?(" · "+new Date(x.data+"T12:00:00").toLocaleDateString("pt-BR")):"");}
function listaSel(){var g=function(f,t){var L=SIMS.filter(f);return L.length?("<optgroup label='"+t+"'>"+L.map(function(x){return "<option value='"+x.id+"'"+(CUR===x.id?" selected":"")+">"+esc(rotulo(x))+"</option>";}).join("")+"</optgroup>"):"";};
  document.getElementById("selSim").innerHTML=(CUR?"":"<option value=''>— "+(isCons()?"Novo relatório":"Nova simulação")+" (ainda não salvo) —</option>")
   +g(function(x){return (x.dados||{}).kind!=="consolidado"&&(x.dados||{}).status!=="realizado";},"Simulações de eventos futuros")
   +g(function(x){return (x.dados||{}).kind!=="consolidado"&&(x.dados||{}).status==="realizado";},"Eventos realizados (prestação de contas)")
   +g(function(x){return (x.dados||{}).kind==="consolidado";},"Relatórios de vários eventos");}
function abrirSim(id){if(!id)return;if(SUJO&&!confirm("Há alterações não salvas. Abrir outra mesmo assim?")){listaSel();return;}var x=SIMS.find(function(s){return s.id===id;});if(!x)return;CUR=id;var d=JSON.parse(JSON.stringify(x.dados||{}));S=Object.assign(d.kind==="consolidado"?novoC():novoS(),d);S.titulo=x.titulo;S.data=x.data||"";if(!S.ar)S.ar={mp:0,cp:0};SUJO=false;listaSel();render();}
function novaSim(silent){if(!silent&&SUJO&&!confirm("Há alterações não salvas. Começar uma nova mesmo assim?"))return;CUR=null;S=novoS();SUJO=false;listaSel();render();}
function novoCons(){if(SUJO&&!confirm("Há alterações não salvas. Começar um novo relatório mesmo assim?"))return;CUR=null;S=novoC();SUJO=false;listaSel();render();}
function duplicarSim(){S=JSON.parse(JSON.stringify(S));S.titulo=(S.titulo||"Simulação")+" (cópia)";CUR=null;SUJO=true;listaSel();render();msg("Cópia criada — ajuste e clique em Salvar.","#5b5446");}
async function salvarSim(){if(!(S.titulo||"").trim()){msg("Dê um nome (item 1).","#8f1d24");var t=document.getElementById("f_titulo");if(t)t.focus();return;}
  var d=JSON.parse(JSON.stringify(S));var rec={titulo:S.titulo.trim(),data:S.data||null,dados:d,updated_at:new Date().toISOString()};
  var r=CUR?await sb.from("evento_simulacoes").update(rec).eq("id",CUR).select("*").single():await sb.from("evento_simulacoes").insert(rec).select("*").single();
  if(r.error){msg("Erro: "+r.error.message,"#8f1d24");return;}
  var x=r.data;SIMS=SIMS.filter(function(s){return s.id!==x.id;});SIMS.unshift(x);CUR=x.id;SUJO=false;listaSel();side();msg("✔ Salvo","#2f6b3a");}
async function excluirSim(){if(!CUR){novaSim(true);return;}if(!confirm("Excluir \""+S.titulo+"\"?"))return;var r=await sb.from("evento_simulacoes").delete().eq("id",CUR);if(r.error){msg("Erro: "+r.error.message,"#8f1d24");return;}SIMS=SIMS.filter(function(s){return s.id!==CUR;});SUJO=false;if(SIMS.length)abrirSim(SIMS[0].id);else novaSim(true);msg("Excluído.","#5b5446");}
function msg(t,c){var m=document.getElementById("msg");m.style.color=c||"#5b5446";m.textContent=t;clearTimeout(window._mt);window._mt=setTimeout(function(){m.textContent="";},4000);}

function set(path,v,re){var o=S,k=path.split(".");for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;SUJO=true;if(re)render();else side();}

  return {E:E,tD:tD,tR:tR,tA:tA,s:tR-tD,sA:tA-tD,aj:aj,ajR:ajR,f:tR-tD+ajR,fA:tA-tD+aj};}
