<script>
var sb=window.supabase.createClient("https://yvdkaycwtulqjnvlpgvy.supabase.co","sb_publishable_v3QZOo0NYLpOAk9p5JBNjQ_r0vb-Zjd");
var DESDE={1:"Nov 2025",2:"Dez 2025",3:"Mar 2026",4:"Mar 2026",5:"Abr 2026"};
function ini(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"")).toUpperCase();}
function avatar(m){if(m.foto_url)return '<span class="av"><img src="'+m.foto_url+'"></span>';return '<span class="av">'+ini(m.nome)+'</span>';}
function fmtData(d){if(!d)return "";var p=(""+d).split("-");return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d;}
function card(m){
  var nuc=m.nucleo?('<div class="nuc">'+m.nucleo+'</div>'):"";
  var extra;
  if(m.eleito){extra='<div class="meta" style="color:var(--gold);font-weight:bold;letter-spacing:.3px;">✦ Eleito'+(m.data_intronizacao?(" · entronização em "+fmtData(m.data_intronizacao)):"")+'</div>';}
  else{var d=DESDE[m.capitulo];var meta=(m.codigo||"")+(d?((m.codigo?" · ":"")+"Desde "+d):"");extra=meta?('<div class="meta">'+meta+'</div>'):"";}
  if(m._titulo)nuc='<div class="nuc" style="color:var(--gold);font-weight:bold;letter-spacing:.3px;">'+m._titulo+'</div>'+(m._sub?('<div class="nuc">'+m._sub+'</div>'):'');
  return '<div class="card"'+(m._destaque?' style="border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;"':'')+'>'+avatar(m)+'<div class="info"><b>'+m.nome+'</b>'+nuc+extra+'</div></div>';
}
function grupo(titulo,itens){
  if(!itens.length)return "";
  var cards=itens.map(function(m){return card(m);}).join("");
  return '<div class="sec-title" data-i18n="'+({"Grão-Mestres":"dir_g_graos","Mestres":"dir_g_mestres","Enólogo da Commanderie":"dir_g_eno","Comendadores":"dir_g_comend","Membros de Honra":"dir_g_honra"}[titulo]||"")+'">'+titulo+'</div><div class="sec-rule"></div><div class="grid">'+cards+'</div>';
}
function rank(g){g=(""+g).toLowerCase();if(g.indexOf("grão")>=0||g.indexOf("grao")>=0)return 0;if(g.indexOf("mestre")>=0)return 1;return 2;}
async function carregar(){
  var u=(await sb.auth.getUser()).data.user;
  if(!u){document.getElementById("loading").style.display="none";document.getElementById("needLogin").style.display="block";return;}
  var q=await sb.from("diretorio").select("*");
  document.getElementById("loading").style.display="none";
  if(q.error){document.getElementById("needLogin").style.display="block";document.getElementById("needLogin").querySelector("p").textContent="Não foi possível carregar ("+q.error.message+").";return;}
  var rows=q.data||[];
  var graos=[],mestres=[],eno=[],comend=[],honra=[];
  rows.forEach(function(m){var g=(""+(m.grau||"")).toLowerCase(),n=(""+(m.nome||"")).toLowerCase();
    if(/jean.?marc/.test(n)){m._titulo="Grão-Mestre · International";m._destaque=1;graos.push(m);}
    else if(rank(m.grau)===0){m._titulo="Grão-Mestre · Brasil";m._destaque=1;graos.push(m);}
    else if(/giacometti/.test(n)){m._titulo="Enólogo da Commanderie";m._sub="Comendador"+(m.nucleo?(" · "+m.nucleo):"");eno.push(m);}
    else if(g.indexOf("honra")>=0)honra.push(m);else if(g.indexOf("mestre")>=0){m._titulo="Mestre"+(m.nucleo?(" · "+m.nucleo):"");mestres.push(m);}else comend.push(m);});
  if(!graos.some(function(m){return m._titulo.indexOf("International")>=0;}))graos.unshift({nome:"Jean-Marc",_titulo:"Grão-Mestre · International",_sub:"Commanderies de Bordeaux",_destaque:1});
  graos.sort(function(a,b){return (a._titulo.indexOf("International")>=0?0:1)-(b._titulo.indexOf("International")>=0?0:1);});
  mestres.sort(function(a,b){return rank(a.grau)-rank(b.grau)||(a.nome||"").localeCompare(b.nome||"","pt");});
  comend.sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"","pt");});
  honra.sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"","pt");});
  document.getElementById("wrap").innerHTML=grupo("Grão-Mestres",graos)+grupo("Mestres",mestres)+grupo("Enólogo da Commanderie",eno)+grupo("Comendadores",comend)+grupo("Membros de Honra",honra);
  document.getElementById("dir").style.display="block";try{setLang(localStorage.getItem("lang")||"pt");}catch(e){}
}
document.addEventListener("DOMContentLoaded",carregar);
</script><script>
