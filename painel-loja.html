<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique — Administração — Commanderie de Bordeaux</title><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#1e2a56"><meta name="apple-mobile-web-app-title" content="Commanderie">
<style>
:root{--parch:#f3ecd9;--parch2:#ece3cd;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;cursor:pointer;transition:all .15s ease;}.dtop .back:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.dhead{text-align:center;padding:30px 20px 4px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:30px;margin:6px 0 2px;}
.wrap{max-width:860px;margin:0 auto;padding:14px 20px 60px;}
.sec-title{font-family:Georgia,serif;color:var(--navy);font-size:21px;font-weight:normal;margin:26px 0 4px;}
.sec-rule{height:1px;background:var(--line);margin:0 0 14px;}
.card{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.inp{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;width:100%;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.btn-n{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;cursor:pointer;}
.prow{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ece0c2;padding:10px 0;flex-wrap:wrap;}
.thumb{flex:none;width:54px;height:54px;border-radius:9px;background:linear-gradient(160deg,#243161,#161f3f);color:var(--gold-l);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;}
.tbl th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;border-bottom:1px solid var(--line);padding:6px 8px;}
.tbl td{border-bottom:1px solid #ece0c2;padding:8px;color:#2a2620;}
.rm{color:#8f1d24;cursor:pointer;font-size:12px;}
.lbl{cursor:pointer;color:var(--navy);border:1px solid var(--gold);border-radius:8px;padding:5px 11px;font-size:12px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
.msg{font-size:13px;margin-left:8px;}
</style></head><body>
<div class="dtop"><a href="painel-conselho.html" style="display:inline-flex;align-items:center;" title="Painel do Conselho"><img src="img/brasao.png" alt="Brasão"></a><b>Boutique — Administração</b><a class="back" href="painel-conselho.html" onclick="if(history.length>1){history.back();return false;}">&#8592; Voltar</a></div>
<div id="needLogin" class="state" style="display:none;"><h2>Acesso restrito</h2><p>Entre na sua conta para acessar.</p><a class="btn" href="index.html">Entrar</a></div>
<div id="notAllowed" class="state" style="display:none;"><h2>Apenas o Conselho</h2><p>Esta página é exclusiva para Mestres e Grão-Mestre.</p><a class="btn" href="index.html">Voltar</a></div>
<div id="loading" class="state">Carregando…</div>
<div id="panel" style="display:none;">
  <div class="dhead"><div class="k">Conselho Diretor</div><h1>Boutique</h1></div>
  <div class="wrap">
    <div class="sec-title">Novo produto</div><div class="sec-rule"></div>
    <div class="card">
      <div class="grid">
        <input class="inp" id="nNome" placeholder="Nome do produto">
        <select class="inp" id="nCat"><option>Cristais</option><option>Vestuário</option><option>Acessórios</option><option>Impressos</option><option>Decoração</option><option>Outros</option></select>
        <input class="inp" id="nPreco" type="number" step="0.01" placeholder="Preço (R$) — opcional">
        <input class="inp" id="nOrdem" type="number" placeholder="Ordem (0)">
      </div>
      <textarea class="inp" id="nDesc" rows="2" placeholder="Descrição" style="margin-top:10px;"></textarea>
      <div style="margin-top:12px;"><button class="btn-n" onclick="addProduto()">Adicionar produto</button><span class="msg" id="nMsg"></span></div>
    </div>

    <div class="sec-title">Produtos</div><div class="sec-rule"></div>
    <div class="card"><div id="lista"></div></div>

    <div class="sec-title">Pedidos</div><div class="sec-rule"></div>
    <div class="card"><div id="pedidos"></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var STATUS=["Novo","Confirmado","Em produção","Entregue","Cancelado"];
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function esca(s){return esc(s).replace(/"/g,"&quot;");}
function brl(v){return "R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function inic(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase()||"·";}
function state(s){["needLogin","notAllowed","loading","panel"].forEach(function(id){var e=document.getElementById(id);if(e)e.style.display=(id===s)?"block":"none";});}
// Enquadra a foto no formato do campo (4:3), centralizada, com margem,
// preenchendo o fundo com a cor de fundo da propria foto (cantos) — sem cortar.
function enquadrar(file){return new Promise(function(res){var img=new Image();img.onload=function(){
  var TW=1000,TH=750,PAD=0.06;var w=img.naturalWidth,h=img.naturalHeight;
  var t=document.createElement("canvas");t.width=w;t.height=h;var tc=t.getContext("2d");tc.drawImage(img,0,0);
  function corner(x,y){try{var d=tc.getImageData(x,y,1,1).data;return [d[0],d[1],d[2]];}catch(e){return [255,255,255];}}
  var cs=[corner(1,1),corner(w-2,1),corner(1,h-2),corner(w-2,h-2)];
  var R=Math.round((cs[0][0]+cs[1][0]+cs[2][0]+cs[3][0])/4),G=Math.round((cs[0][1]+cs[1][1]+cs[2][1]+cs[3][1])/4),B=Math.round((cs[0][2]+cs[1][2]+cs[2][2]+cs[3][2])/4);
  var cv=document.createElement("canvas");cv.width=TW;cv.height=TH;var cx=cv.getContext("2d");
  cx.fillStyle="rgb("+R+","+G+","+B+")";cx.fillRect(0,0,TW,TH);
  var aw=TW*(1-2*PAD),ah=TH*(1-2*PAD);var sc=Math.min(aw/w,ah/h);var dw=w*sc,dh=h*sc;
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";
  cx.drawImage(img,(TW-dw)/2,(TH-dh)/2,dw,dh);
  cv.toBlob(function(bl){res(bl||file);},"image/jpeg",0.88);
};img.onerror=function(){res(file);};var rd=new FileReader();rd.onload=function(e){img.src=e.target.result;};rd.readAsDataURL(file);});}
function val(id){var e=document.getElementById(id);return e?e.value.trim():"";}
async function init(){var u=(await sb.auth.getUser()).data.user;if(!u){state("needLogin");return;}var ic=await sb.rpc("is_conselho");if(ic.error||!ic.data){state("notAllowed");return;}state("panel");await carregar();await carregarPedidos();}
async function addProduto(){
  var msg=document.getElementById("nMsg");var nome=val("nNome");
  if(!nome){msg.style.color="#8f1d24";msg.textContent="Informe o nome.";return;}
  var pr=parseFloat(document.getElementById("nPreco").value);var ord=parseInt(document.getElementById("nOrdem").value,10);
  msg.style.color="#2f6b3a";msg.textContent="Salvando...";
  var r=await sb.from("loja_produtos").insert({nome:nome,categoria:val("nCat"),descricao:val("nDesc")||null,preco:isNaN(pr)?null:pr,ordem:isNaN(ord)?0:ord,ativo:true});
  if(r.error){msg.style.color="#8f1d24";msg.textContent=r.error.message;return;}
  msg.textContent="Adicionado!";["nNome","nPreco","nOrdem","nDesc"].forEach(function(id){document.getElementById(id).value="";});carregar();
}
async function carregar(){
  var el=document.getElementById("lista");
  var q=await sb.from("loja_produtos").select("*").order("categoria",{ascending:true}).order("ordem",{ascending:true});
  if(q.error){el.innerHTML="<p style=\"color:#9a937f;font-size:13px;\">(rode o SQL da loja) "+esc(q.error.message)+"</p>";return;}
  var rows=q.data||[];
  if(!rows.length){el.innerHTML="<p style=\"color:#8a8270;font-size:13px;\">Nenhum produto ainda.</p>";return;}
  el.innerHTML=rows.map(function(p){
    var th=p.foto_url?("<img src=\""+esc(p.foto_url)+"?t="+Date.now()+"\">"):inic(p.nome);
    return "<div class=\"prow\"><div class=\"thumb\">"+th+"</div>"
      +"<div style=\"flex:1;min-width:160px;\"><b style=\"font-family:Georgia,serif;color:var(--navy);\">"+esc(p.nome)+"</b><div style=\"font-size:11.5px;color:#8a8270;\">"+esc(p.categoria||"")+(p.descricao?(" · "+esc(p.descricao)):"")+"</div></div>"
      +"<div style=\"display:flex;gap:6px;align-items:center;\"><span style=\"font-size:11px;color:#8a8270;\">R$</span><input class=\"inp\" style=\"width:90px;\" type=\"number\" step=\"0.01\" value=\""+(p.preco==null?"":p.preco)+"\" onchange=\"setPreco('"+p.id+"',this.value)\"></div>"
      +"<label style=\"display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#5b5446;\"><input type=\"checkbox\" "+(p.ativo?"checked":"")+" onchange=\"setAtivo('"+p.id+"',this.checked)\"> ativo</label>"
      +"<label class=\"lbl\">foto<input type=\"file\" accept=\"image/*\" style=\"display:none\" onchange=\"upFoto('"+p.id+"',this.files)\"></label>"
      +"<a class=\"rm\" onclick=\"delProduto('"+p.id+"')\">remover</a></div>";
  }).join("");
}
async function setPreco(id,v){var pr=parseFloat(v);var r=await sb.from("loja_produtos").update({preco:isNaN(pr)?null:pr}).eq("id",id);if(r.error)alert("Erro: "+r.error.message);}
async function setAtivo(id,v){var r=await sb.from("loja_produtos").update({ativo:v}).eq("id",id);if(r.error)alert("Erro: "+r.error.message);}
async function upFoto(id,files){if(!files||!files.length)return;var blob=await enquadrar(files[0]);var path=id+"_"+Date.now()+".jpg";var up=await sb.storage.from("loja").upload(path,blob,{contentType:"image/jpeg",upsert:true});if(up.error){alert("Erro ao enviar foto: "+up.error.message);return;}var url=sb.storage.from("loja").getPublicUrl(path).data.publicUrl;var r=await sb.from("loja_produtos").update({foto_url:url}).eq("id",id);if(r.error){alert("Erro: "+r.error.message);return;}carregar();}
async function delProduto(id){if(!confirm("Remover este produto?"))return;var r=await sb.from("loja_produtos").delete().eq("id",id);if(r.error){alert("Erro: "+r.error.message);return;}carregar();}
async function carregarPedidos(){
  var el=document.getElementById("pedidos");
  var q=await sb.from("loja_pedidos").select("*").order("created_at",{ascending:false});
  if(q.error){el.innerHTML="<p style=\"color:#9a937f;font-size:13px;\">"+esc(q.error.message)+"</p>";return;}
  var rows=q.data||[];
  if(!rows.length){el.innerHTML="<p style=\"color:#8a8270;font-size:13px;\">Nenhum pedido ainda.</p>";return;}
  var tb="<table class=\"tbl\"><thead><tr><th>Data</th><th>Comendador</th><th>Produto</th><th>Qtd</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>";
  rows.forEach(function(x){var d=x.created_at?new Date(x.created_at).toLocaleDateString("pt-BR"):"";var v=(x.preco!=null&&Number(x.preco)>0)?brl(Number(x.preco)*(x.qtd||1)):"—";var sel="<select onchange=\"setStatus('"+x.id+"',this.value)\" style=\"padding:5px 7px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;\">"+STATUS.map(function(s){return "<option"+(s===x.status?" selected":"")+">"+s+"</option>";}).join("")+"</select>";tb+="<tr><td>"+d+"</td><td>"+esc(x.nome||"")+"</td><td>"+esc(x.produto_nome||"")+(x.obs?("<br><small style=\"color:#9a937f;\">"+esc(x.obs)+"</small>"):"")+"</td><td>"+esc(x.qtd||1)+"</td><td>"+v+"</td><td>"+sel+"</td><td><a class=\"rm\" onclick=\"delPedido('"+x.id+"')\">remover</a></td></tr>";});
  el.innerHTML=tb+"</tbody></table>";
}
async function setStatus(id,s){var r=await sb.from("loja_pedidos").update({status:s}).eq("id",id);if(r.error)alert("Erro: "+r.error.message);}
async function delPedido(id){if(!confirm("Remover este pedido?"))return;var r=await sb.from("loja_pedidos").delete().eq("id",id);if(r.error){alert("Erro: "+r.error.message);return;}carregarPedidos();}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
