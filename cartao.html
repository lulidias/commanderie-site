<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu cartão — Jantar de 1 Ano da Commanderie</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141d38;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;font-family:'Montserrat',sans-serif}
canvas{max-width:min(92vw,460px);height:auto;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 30px;background:#b08a3a;color:#fff;border:none;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:6px}
.btn.ghost{background:none;border:1px solid rgba(197,163,90,.6);color:#c5a35a}
.aviso{color:rgba(243,236,217,.6);font-size:11px;text-align:center;max-width:430px;line-height:1.6}
body.foto{padding:0;gap:0}body.foto .acoes,body.foto .aviso{display:none}body.foto canvas{max-width:none;width:1080px;border-radius:0;box-shadow:none}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2E7D4F;color:#fff;padding:13px 26px;font-size:12px;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;border-radius:6px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div class="acoes">
  <button class="btn" id="b-share" onclick="compartilhar()">📲 Compartilhar</button>
  <button class="btn" id="b-copy" onclick="copiar()">📋 Copiar imagem</button>
  <button class="btn ghost" onclick="baixar()">Baixar</button>
</div>
<p class="aviso" id="aviso">Poste nos grupos da Commanderie e chame os Comendadores para a mesa. 🍷</p>
<div id="toast">Imagem copiada!</div>
<script>
'use strict';
var params=new URLSearchParams(location.search);
var NOME=(params.get('nome')||'Comendador').trim();
var GRAU=(params.get('grau')||'Comendador').trim().toUpperCase();
var BRAS=new Image();BRAS.crossOrigin='anonymous';
function desenha(){
  var c=document.getElementById('c'),x=c.getContext('2d');
  var W=1080,H=1350,CX=W/2;
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a3a63');g.addColorStop(.5,'#1b2748');g.addColorStop(1,'#131c38');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#c5a35a';x.lineWidth=4;x.strokeRect(36,36,W-72,H-72);
  x.strokeStyle='rgba(197,163,90,.5)';x.lineWidth=1.5;x.strokeRect(58,58,W-116,H-116);
  x.textAlign='center';
  x.fillStyle='#c5a35a';x.font='600 24px Montserrat';try{x.letterSpacing='9px';}catch(e){}
  x.fillText('COMMANDERIE DE BORDEAUX · BRASIL',CX,140);
  try{x.letterSpacing='0px';}catch(e){}
  var EC=320,RR=94;
  x.beginPath();x.arc(CX,EC,RR,0,7);x.fillStyle='#f3ecd9';x.fill();
  if(BRAS.complete&&BRAS.naturalWidth){var iw=148,ih=iw*BRAS.naturalHeight/BRAS.naturalWidth;x.drawImage(BRAS,CX-iw/2,EC-ih/2,iw,ih);}
  x.fillStyle='#ffffff';try{x.letterSpacing='10px';}catch(e){}
  x.font='400 66px "Playfair Display", Georgia, serif';
  x.fillText('JANTAR DE 1 ANO',CX+5,532);
  try{x.letterSpacing='2px';}catch(e){}
  x.fillStyle='#e5d7b4';x.font='italic 400 33px "Playfair Display", Georgia, serif';
  x.fillText('da Commanderie de Bordeaux',CX,586);
  try{x.letterSpacing='0px';}catch(e){}
  x.strokeStyle='rgba(197,163,90,.8)';x.lineWidth=2;x.beginPath();x.moveTo(CX-130,648);x.lineTo(CX+130,648);x.stroke();
  x.fillStyle='#c5a35a';x.font='italic 400 78px "Playfair Display", Georgia, serif';
  x.fillText('Eu vou!',CX,756);
  x.fillStyle='#ffffff';var tam=104;x.font='italic 600 '+tam+'px "Playfair Display", Georgia, serif';
  while(x.measureText(NOME).width>880&&tam>50){tam-=6;x.font='italic 600 '+tam+'px "Playfair Display", Georgia, serif';}
  x.fillText(NOME,CX,902);
  x.fillStyle='#c5a35a';x.font='600 24px Montserrat';try{x.letterSpacing='5px';}catch(e){}
  x.fillText(GRAU,CX,968);
  try{x.letterSpacing='0px';}catch(e){}
  x.strokeStyle='rgba(197,163,90,.35)';x.lineWidth=1;x.beginPath();x.moveTo(CX-180,1096);x.lineTo(CX+180,1096);x.stroke();
  x.fillStyle='#f3ecd9';x.font='500 27px Montserrat';try{x.letterSpacing='1px';}catch(e){}
  x.fillText('22 de outubro de 2026 · 20h30 · Piselli Boa Vista',CX,1154);
  try{x.letterSpacing='0px';}catch(e){}
  x.fillStyle='rgba(243,236,217,.85)';x.font='italic 400 36px "Cormorant Garamond", Georgia, serif';
  x.fillText('24 Grands Crus Classés de Saint-Émilion, em magnum.',CX,1218);
  }
function avisa(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0';},3500);}
function copiar(){document.getElementById('c').toBlob(function(b){if(navigator.clipboard&&window.ClipboardItem){navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(function(){avisa('✓ Imagem copiada! Cole (Cmd+V) na conversa do WhatsApp.');}).catch(function(){baixar();});}else{baixar();}});}
function baixar(){var a=document.createElement('a');a.download='commanderie-jantar-eu-vou.png';a.href=document.getElementById('c').toDataURL('image/png');a.click();}
function compartilhar(){document.getElementById('c').toBlob(function(b){var f=new File([b],'commanderie-jantar-eu-vou.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]});}else{baixar();}});}
window.addEventListener('DOMContentLoaded',function(){
  if(params.get('foto'))document.body.classList.add('foto');
  var mobile=/iPhone|iPad|Android/i.test(navigator.userAgent);
  if(!mobile){document.getElementById('b-share').style.display='none';document.getElementById('aviso').textContent='Clique em Copiar imagem e cole (Cmd+V) na conversa do WhatsApp. 🍷';}
  BRAS.onload=desenha;BRAS.onerror=desenha;BRAS.src='/img/brasao-alta.png';
  var fonts=[document.fonts.load('400 70px "Playfair Display"'),document.fonts.load('italic 600 100px "Playfair Display"'),document.fonts.load('600 25px Montserrat'),document.fonts.load('italic 400 40px "Cormorant Garamond"')];
  Promise.all(fonts).then(function(){setTimeout(desenha,60);}).catch(desenha);
});
</script>
</body>
</html>
