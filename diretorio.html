.av img{width:100%;height:100%;object-fit:cover;}
.info{min-width:0;}
.info b{display:block;font-family:Georgia,serif;color:var(--navy);font-weight:normal;font-size:16px;line-height:1.2;}
.nuc{font-size:12.5px;color:var(--red);margin-top:2px;}
.meta{font-size:11.5px;color:#9a8f72;letter-spacing:.5px;margin-top:3px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}

<div class="dfoot"><div class="m">“Bordeaux, toujours Bordeaux”</div><div style="margin:16px 0 0;"><a href="https://www.instagram.com/commanderiedebordeauxbr/" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;color:#e7d8a8;text-decoration:none;font-size:13px;letter-spacing:.3px;"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true" style="flex:none;"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.43.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.43.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.43-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.43-.16 1.06-.36 2.23-.41C8.42 2.21 8.8 2.2 12 2.2zm0 1.8c-3.15 0-3.52.01-4.77.07-.9.04-1.38.19-1.7.32-.43.16-.74.36-1.06.68-.32.32-.52.63-.68 1.06-.13.32-.28.8-.32 1.7-.06 1.25-.07 1.62-.07 4.77s.01 3.52.07 4.77c.04.9.19 1.38.32 1.7.16.43.36.74.68 1.06.32.32.63.52 1.06.68.32.13.8.28 1.7.32 1.25.06 1.62.07 4.77.07s3.52-.01 4.77-.07c.9-.04 1.38-.19 1.7-.32.43-.16.74-.36 1.06-.68.32-.32.52-.63.68-1.06.13-.32.28-.8.32-1.7.06-1.25.07-1.62.07-4.77s-.01-3.52-.07-4.77c-.04-.9-.19-1.38-.32-1.7a2.85 2.85 0 0 0-.68-1.06 2.85 2.85 0 0 0-1.06-.68c-.32-.13-.8-.28-1.7-.32C15.52 4.01 15.15 4 12 4zm0 3.07A4.93 4.93 0 1 1 7.07 12 4.93 4.93 0 0 1 12 7.07zm0 1.8A3.13 3.13 0 1 0 15.13 12 3.13 3.13 0 0 0 12 8.87zm5.13-.99a1.15 1.15 0 1 1-1.15 1.15 1.15 1.15 0 0 1 1.15-1.15z"/></svg>@commanderiedebordeauxbr</a></div></div>

<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var DESDE={1:"Nov 2025",2:"Dez 2025",3:"Mar 2026",4:"Mar 2026",5:"Abr 2026"};
function ini(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"")).toUpperCase();}
function avatar(m){if(m.foto_url)return '<span class="av"><img src="'+m.foto_url+'"></span>';return '<span class="av">'+ini(m.nome)+'</span>';}
function fmtData(d){if(!d)return "";var p=(""+d).split("-");return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d;}
function card(m){
  var nuc=m.nucleo?('<div class="nuc">'+m.nucleo+'</div>'):"";
  var extra;
  if(m.eleito){extra='<div class="meta" style="color:var(--gold);font-weight:bold;letter-spacing:.3px;">✦ Eleito'+(m.data_intronizacao?(" · intronização em "+fmtData(m.data_intronizacao)):"")+'</div>';}
  else{var d=DESDE[m.capitulo];var meta=(m.codigo||"")+(d?(" · Desde "+d):"");extra=meta?('<div class="meta">'+meta+'</div>'):"";}
  return '<div class="card">'+avatar(m)+'<div class="info"><b>'+m.nome+'</b>'+nuc+extra+'</div></div>';
}
function grupo(titulo,itens){
  if(!itens.length)return "";
  var cards=itens.map(function(m){return card(m);}).join("");
  return '<div class="sec-title">'+titulo+'</div><div class="sec-rule"></div><div class="grid">'+cards+'</div>';
}
function rank(g){g=(""+g).toLowerCase();if(g.indexOf("grão")>=0||g.indexOf("grao")>=0)return 0;if(g.indexOf("mestre")>=0)return 1;return 2;}
async function carregar(){
  var u=(await sb.auth.getUser()).data.user;
  if(!u){document.getElementById("loading").style.display="none";document.getElementById("needLogin").style.display="block";return;}
  var q=await sb.from("diretorio").select("*");
  document.getElementById("loading").style.display="none";
  if(q.error){document.getElementById("needLogin").style.display="block";document.getElementById("needLogin").querySelector("p").textContent="Não foi possível carregar ("+q.error.message+").";return;}
  var rows=q.data||[];
  var mestres=[],comend=[],honra=[];
  rows.forEach(function(m){var g=(""+(m.grau||"")).toLowerCase();if(g.indexOf("honra")>=0)honra.push(m);else if(g.indexOf("mestre")>=0)mestres.push(m);else comend.push(m);});
  mestres.sort(function(a,b){return rank(a.grau)-rank(b.grau)||(a.nome||"").localeCompare(b.nome||"","pt");});
  comend.sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"","pt");});
  honra.sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"","pt");});
  document.getElementById("wrap").innerHTML=grupo("Mestres",mestres)+grupo("Comendadores",comend)+grupo("Membros de Honra",honra);
  document.getElementById("dir").style.display="block";
}
document.addEventListener("DOMContentLoaded",carregar);
</script></body></html>
