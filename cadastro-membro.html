<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar acesso — Commanderie de Bordeaux</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><meta name="theme-color" content="#1e2a56">
<style>
:root{--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fffdf7;border:1px solid var(--line);border-radius:18px;max-width:430px;width:100%;padding:30px 28px;text-align:center;box-shadow:0 16px 40px rgba(40,30,10,.12);}
.card img.bras{width:66px;margin-bottom:12px;}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:25px;margin:6px 0 8px;}
p.lead{font-size:14px;color:#5b5446;line-height:1.55;margin:0 0 18px;}
label{display:block;text-align:left;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;margin:12px 0 4px;}
select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink);background:#fbf7ec;font-family:inherit;}
.btn{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:13px;font-size:15.5px;cursor:pointer;}
.btn:disabled{opacity:.6;cursor:default;}
.msg{font-size:13.5px;margin-top:12px;min-height:18px;line-height:1.5;}
.alt{display:block;margin-top:16px;font-size:13px;color:var(--navy);text-decoration:none;}
.lema{margin-top:18px;font-family:Georgia,serif;font-style:italic;color:#8a6a1f;font-size:13px;}
</style></head><body>
<div class="card">
  <img class="bras" src="img/brasao.png" alt="Brasão">
  <div class="k">Commanderie de Bordeaux do Brasil</div>
  <h1>Crie o seu acesso</h1>
  <p class="lead">Comendador, selecione o seu nome, informe um e-mail e crie uma senha para entrar no site da confraria.</p>
  <div id="form">
    <label for="nome">Seu nome</label>
    <select id="nome"><option value="">Carregando…</option></select>
    <label for="email">Seu e-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com">
    <label for="senha">Crie uma senha</label>
    <input id="senha" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
    <button class="btn" id="btn" onclick="cadastrar()">Criar meu acesso</button>
    <div class="msg" id="msg"></div>
  </div>
  <a class="alt" href="index.html">Já tenho acesso — Entrar</a>
  <div class="lema">Bordeaux, toujours Bordeaux</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function setMsg(t,ok){var m=document.getElementById("msg");m.textContent=t;m.style.color=ok?"#2f6b3a":"#8f1d24";}
async function carregar(){
  var sel=document.getElementById("nome");
  var r=await sb.rpc("membros_sem_acesso");
  if(r.error){sel.innerHTML='<option value="">Não foi possível carregar</option>';return;}
  var rows=r.data||[];
  if(!rows.length){sel.innerHTML='<option value="">Nenhum nome disponível</option>';return;}
  sel.innerHTML='<option value="">Selecione o seu nome…</option>'+rows.map(function(m){return '<option value="'+m.id+'">'+esc(m.nome)+(m.nucleo?(" · "+esc(m.nucleo)):"")+'</option>';}).join("");
}
async function cadastrar(){
  var id=document.getElementById("nome").value;
  var email=(document.getElementById("email").value||"").trim();
  var senha=document.getElementById("senha").value||"";
  if(!id){setMsg("Selecione o seu nome na lista.");return;}
  if(!email||email.indexOf("@")<0){setMsg("Informe um e-mail válido.");return;}
  if(senha.length<6){setMsg("A senha precisa ter ao menos 6 caracteres.");return;}
  var btn=document.getElementById("btn");btn.disabled=true;setMsg("Criando o seu acesso…",true);
  var s=await sb.auth.signUp({email:email,password:senha});
  if(s.error){btn.disabled=false;var em=(""+s.error.message).toLowerCase();setMsg(em.indexOf("registered")>=0?"Este e-mail já tem conta. Use “Já tenho acesso — Entrar”.":s.error.message);return;}
  var r=await sb.rpc("cadastrar_membro_por_nome",{p_id:id,p_email:email});
  if(r.error){btn.disabled=false;setMsg("Erro ao associar: "+r.error.message);return;}
  if(r.data==="ok"){setMsg("Acesso criado! Entrando…",true);setTimeout(function(){location.href="index.html";},1300);return;}
  btn.disabled=false;
  if(r.data==="ja_vinculado")setMsg("Você já tem um acesso criado. Use “Entrar”.");
  else if(r.data==="indisponivel")setMsg("Este nome já criou acesso. Faça login ou fale com a Secretaria.");
  else if(r.data==="sem_sessao")setMsg("Confirme o seu e-mail (verifique a caixa de entrada) e tente entrar.");
  else setMsg("Não foi possível concluir. Fale com a Secretaria.");
}
carregar();
</script></body></html>
