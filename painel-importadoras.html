<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importadoras — Commanderie de Bordeaux</title><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><meta name="theme-color" content="#1e2a56">
<style>
:root{--parch:#f3ecd9;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;cursor:pointer;}.dtop .back:hover{background:var(--navy);color:#fff;}
.dhead{text-align:center;padding:28px 20px 4px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:30px;margin:6px 0 2px;}
.wrap{max-width:900px;margin:0 auto;padding:14px 20px 60px;}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.inp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
.nuctitle{font-family:Georgia,serif;color:var(--navy);font-size:19px;font-weight:normal;margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;}
.mcard{background:#fffdf7;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.mhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;}
.mav{width:40px;height:40px;border-radius:50%;background:#f6efdc;border:1px solid #e6d9b3;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:Georgia,serif;font-size:16px;flex:none;overflow:hidden;}
.mav img{width:100%;height:100%;object-fit:cover;}
.mname{font-family:Georgia,serif;color:var(--navy);font-size:15.5px;}
.mmeta{font-size:12px;color:#8a8270;margin-top:1px;}
.pill{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 9px;white-space:nowrap;}
.p-pago{color:#2f6b3a;background:#eef6ef;border:1px solid #cfe6d3;} .p-aberto{color:#8a6a1f;background:#f6efdc;border:1px solid var(--line);} .p-isento{color:#5b5446;background:#efe9da;border:1px solid var(--line);}
.mbody{display:none;border-top:1px solid #ece0c2;padding:14px;background:#fcf9f0;}
.grp{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:bold;margin:4px 0 8px;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;}
.kv .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;}
.kv .v{font-size:13.5px;color:#2a2620;white-space:pre-wrap;}
.fichabox{margin-top:12px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
</style></head>
<body>
<div class="dtop"><a href="painel-conselho.html" style="display:inline-flex;align-items:center;" title="Painel do Conselho"><img src="img/brasao.png" alt="Brasão"></a><b>Importadoras Membros</b><a class="back" href="painel-conselho.html">&#8592; Voltar</a></div>
<div id="needLogin" class="state" style="display:none;"><h2>Acesso restrito</h2><p>Entre na sua conta para acessar.</p><a class="btn" href="index.html">Entrar</a></div>
<div id="notAllowed" class="state" style="display:none;"><h2>Apenas o Conselho</h2><p>Esta página é exclusiva para Mestres e Grão-Mestre.</p><a class="btn" href="index.html">Voltar</a></div>
<div id="loading" class="state">Carregando…</div>
<div id="panel" style="display:none;">
  <div class="dhead"><div class="k">Conselho</div><h1>Importadoras Membros</h1><div class="sub" style="font-size:13px;color:#8a8270;" id="resumo"></div></div>
  <div class="wrap">
    <div class="tools"><input class="inp" id="busca" placeholder="Buscar por importadora, responsável, cidade, e-mail…" oninput="render()" style="flex:1;min-width:200px;"><button onclick="novaToggle()" style="background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;">+ Nova importadora</button></div>
    <div id="novaBox" style="display:none;background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;">
      <div style="font-family:Georgia,serif;color:var(--navy);font-size:17px;margin-bottom:8px;">Nova importadora membro</div>
      <div id="novaCampos" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;"></div>
      <div style="margin-top:10px;"><button onclick="criarImp()" style="background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;">Adicionar</button> <a onclick="novaToggle()" style="color:#8a8270;cursor:pointer;font-size:13px;margin-left:8px;">cancelar</a> <span id="novaMsg" style="font-size:12.5px;margin-left:8px;"></span></div>
    </div>
    <div id="lista"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://yvdkaycwtulqjnvlpgvy.supabase.co","sb_publishable_v3QZOo0NYLpOAk9p5JBNjQ_r0vb-Zjd");
var IMPS=[],RESP={},INDS={},ANO=(new Date()).getFullYear();
function st(id){["needLogin","notAllowed","loading","panel"].forEach(function(x){var e=document.getElementById(x);if(e)e.style.display=(x===id)?"block":"none";});}
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fdata(d){if(!d)return "";var p=(""+d).split("T")[0].split("-");return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d;}
function ini(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase();}
function nrm(s){return (""+(s||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function brl(v){return "R$ "+(Math.round(Number(v)||0)).toLocaleString("pt-BR");}
function row(k,v){if(v==null||v==="")return "";return "<div><div class=\"k\">"+esc(k)+"</div><div class=\"v\">"+esc(v)+"</div></div>";}
function pill(x){if(x.anuidade_paga)return "<span class=\"pill p-pago\">Anuidade em dia</span>";if(new Date()>new Date("2026-11-02T12:00:00"))return "<span class=\"pill\" style=\"color:#8f1d24;background:#fbeaea;border:1px solid #e6cccc;\">Em atraso</span>";return "<span class=\"pill p-aberto\">A vencer 02/11</span>";}
function resp(x){return RESP[x.owner_user_id]||{};}
var CAMPOS=[["nome","Importadora"],["responsavel_nome","Responsável"],["cidade","Cidade"],["email","E-mail"],["telefone","Telefone"],["instagram","Instagram"],["membro_desde","Membro desde","date"],["anuidade_valor","Anuidade (R$)","number"],["cota_membros","Cota de indicações de membros","number"],["cota_restaurantes","Cota de restaurantes","number"]];
function edForm(x){var ii="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fbf7ec;font-family:inherit;";
  return "<div id=\"ed_"+x.id+"\" style=\"display:none;margin-top:10px;background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:12px;\"><div style=\"font-size:11px;color:#8a8270;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;\">Editar cadastro</div><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;\">"
  +CAMPOS.filter(function(c){return c[0] in x;}).map(function(c){return "<label style=\"display:block;\"><span style=\"display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;margin-bottom:3px;\">"+c[1]+"</span><input id=\"ei_"+c[0]+"_"+x.id+"\" "+(c[2]==="number"?"type=\"number\" step=\"0.01\" ":(c[2]==="date"?"type=\"date\" ":""))+"value=\""+esc(x[c[0]]==null?"":(c[2]==="date"?(""+x[c[0]]).slice(0,10):x[c[0]]))+"\" style=\""+ii+"\"></label>";}).join("")
  +lbl("Login do responsável (membro)","<select id=\"ei_owner_user_id_"+x.id+"\" style=\""+ii+"\">"+ownerOpts(x.owner_user_id||"")+"</select>")+"</div><div style=\"margin-top:10px;\"><button onclick=\"salvarImp('"+x.id+"')\" style=\"background:var(--navy);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;\">Salvar</button> <span id=\"ei_msg_"+x.id+"\" style=\"font-size:12.5px;margin-left:8px;\"></span></div></div>";}
function card(x){var r=resp(x);var foto=r.foto_url?("<img src=\""+esc(r.foto_url)+"\" alt=\"\">"):esc(ini(x.nome));
  var email=x.email||r.email||"";var tel=x.telefone||((r.telefone_ddi?r.telefone_ddi+" ":"")+(r.telefone||""));
  var meta=[x.responsavel_nome||r.nome,x.cidade].filter(Boolean).join(" · ");
  var head="<div class=\"mhead\" onclick=\"toggle(this)\"><div class=\"mav\">"+foto+"</div><div style=\"flex:1;min-width:0;\"><div class=\"mname\">"+esc(x.nome)+"</div><div class=\"mmeta\">"+esc(meta)+(email?(" · "+esc(email)):"")+"</div></div>"+pill(x)+"</div>";
  var ind=INDS[x.id]||[];
  var cad="<div class=\"grp\">Cadastro <a onclick=\"editarImp('"+x.id+"')\" style=\"color:var(--navy);cursor:pointer;font-size:10px;font-weight:normal;text-transform:none;letter-spacing:0;margin-left:8px;\">editar</a></div><div class=\"kv\">"
   +row("Responsável",x.responsavel_nome||r.nome)+row("E-mail",email)+row("Telefone",tel)+row("Instagram",x.instagram)+row("Cidade",x.cidade)+row("Membro desde",fdata(x.membro_desde))
   +row("Anuidade",x.anuidade_valor!=null?brl(x.anuidade_valor):"")+row("Situação",x.anuidade_paga?("Paga"+(x.anuidade_pago_em?(" em "+fdata(x.anuidade_pago_em)):"")):"Em aberto")
   +row("Cota de membros",x.cota_membros)+row("Cota de restaurantes",x.cota_restaurantes)+"</div>"+edForm(x);
  var lst=ind.length?("<div class=\"grp\" style=\"margin-top:14px;\">Indicações de membros ("+ind.length+")</div><div style=\"font-size:13px;line-height:1.7;\">"+ind.map(function(m){return esc(m.nome)+" <span style=\"color:#8a8270;font-size:11.5px;\">"+esc([m.ano,m.nucleo,m.tipo].filter(Boolean).join(" · "))+"</span>";}).join("<br>")+"</div>"):"";
  return "<div class=\"mcard\">"+head+"<div class=\"mbody\">"+cad+lst+"</div></div>";}
var MEMBROS_LOGIN=[];
function ownerOpts(sel){return "<option value=\"\">— sem login vinculado —</option>"+MEMBROS_LOGIN.map(function(m){return "<option value=\""+m.user_id+"\""+(m.user_id===sel?" selected":"")+">"+esc(m.nome)+(m.email?(" · "+esc(m.email)):"")+"</option>";}).join("");}
function lbl(t,h){return "<label style=\"display:block;\"><span style=\"display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;margin-bottom:3px;\">"+t+"</span>"+h+"</label>";}
var II="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fbf7ec;font-family:inherit;";
function novaToggle(){var b=document.getElementById("novaBox");var abrir=b.style.display==="none";b.style.display=abrir?"block":"none";if(abrir){
  var c=[["nome","Importadora *"],["responsavel_nome","Responsável"],["cidade","Cidade"],["email","E-mail"],["telefone","Telefone"],["instagram","Instagram"],["membro_desde","Membro desde","date",(function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})()],["anuidade_valor","Anuidade (R$)","number",10000]];
  document.getElementById("novaCampos").innerHTML=c.map(function(f){return lbl(f[1],"<input id=\"nv_"+f[0]+"\" "+(f[2]?"type=\""+f[2]+"\" ":"")+"value=\""+(f[3]!=null?f[3]:"")+"\" style=\""+II+"\">");}).join("")+lbl("Login do responsável (membro)","<select id=\"nv_owner_user_id\" style=\""+II+"\">"+ownerOpts("")+"</select>");
  document.getElementById("novaMsg").textContent="";}}
async function criarImp(){var msg=document.getElementById("novaMsg");var g=function(k){var e=document.getElementById("nv_"+k);return e?(""+e.value).trim():"";};
  var nome=g("nome");if(!nome){msg.style.color="#8f1d24";msg.textContent="Informe o nome da importadora.";return;}
  if(IMPS.some(function(x){return nrm(x.nome)===nrm(nome);})){msg.style.color="#8f1d24";msg.textContent="Já existe uma importadora com esse nome.";return;}
  var d={nome:nome};["responsavel_nome","cidade","email","telefone","instagram","owner_user_id"].forEach(function(k){if(g(k))d[k]=g(k);});if(g("membro_desde"))d.membro_desde=g("membro_desde");if(g("anuidade_valor"))d.anuidade_valor=Number(g("anuidade_valor"));
  msg.style.color="#5b5446";msg.textContent="Salvando…";var r=await sb.rpc("conselho_criar_importadora",{p_dados:d});
  if(r.error){msg.style.color="#8f1d24";msg.textContent=/conselho_criar_importadora/.test(r.error.message)?"Falta rodar o SQL sql/importadoras_editar.sql (nova versão) no Supabase.":r.error.message;return;}
  msg.style.color="#2f6b3a";msg.textContent="Importadora adicionada!";document.getElementById("busca").value="";await carregar();setTimeout(function(){document.getElementById("novaBox").style.display="none";},900);}
function toggle(el){var b=el.nextElementSibling;if(b)b.style.display=(b.style.display==="block")?"none":"block";}
function editarImp(id){var e=document.getElementById("ed_"+id);if(e)e.style.display=(e.style.display==="none")?"block":"none";}
async function salvarImp(id){var x=IMPS.filter(function(i){return i.id===id;})[0]||{};var patch={};CAMPOS.forEach(function(c){var e=document.getElementById("ei_"+c[0]+"_"+id);if(!e)return;var v=(""+e.value).trim();var old=(x[c[0]]==null?"":(c[2]==="date"?(""+x[c[0]]).slice(0,10):""+x[c[0]]));if(v!==old)patch[c[0]]=(v===""?null:(c[2]==="number"?Number(v):v));});
  var eo=document.getElementById("ei_owner_user_id_"+id);if(eo&&eo.value!==(x.owner_user_id||""))patch.owner_user_id=eo.value||null;
  var msg=document.getElementById("ei_msg_"+id);if(!Object.keys(patch).length){msg.style.color="#8a8270";msg.textContent="Nada para alterar.";return;}
  if(patch.nome===null){msg.style.color="#8f1d24";msg.textContent="Informe o nome.";return;}
  msg.style.color="#2f6b3a";msg.textContent="Salvando...";var r=await sb.rpc("conselho_editar_importadora",{p_id:id,p_patch:patch});
  if(r.error){msg.style.color="#8f1d24";msg.textContent=/conselho_editar_importadora/.test(r.error.message)?"Falta rodar o SQL sql/importadoras_editar.sql no Supabase.":r.error.message;return;}
  msg.textContent="Salvo!";await carregar();}
function render(){var q=nrm(document.getElementById("busca").value);
  var list=IMPS.filter(function(x){if(!q)return true;var r=resp(x);return nrm([x.nome,x.responsavel_nome,r.nome,x.cidade,x.email,r.email].join(" ")).indexOf(q)>=0;});
  var pagas=IMPS.filter(function(x){return x.anuidade_paga;}).length;
  document.getElementById("resumo").textContent=list.length+" de "+IMPS.length+" importadoras · "+pagas+" com anuidade em dia";
  document.getElementById("lista").innerHTML=list.map(card).join("")||"<p style=\"color:#8a8270;font-size:13px;\">Nenhuma importadora encontrada.</p>";}
async function carregar(){var q=await sb.from("importadoras").select("*").order("nome",{ascending:true});
  if(q.error){document.getElementById("lista").innerHTML="<p style=\"color:#9a937f;\">"+esc(q.error.message)+"</p>";return;}
  IMPS=q.data||[];var ids=IMPS.map(function(x){return x.owner_user_id;}).filter(Boolean);RESP={};
  if(ids.length){var m=await sb.from("membros").select("user_id,nome,email,telefone,telefone_ddi,foto_url").in("user_id",ids);(m.data||[]).forEach(function(r){RESP[r.user_id]=r;});}
  try{var ml=await sb.from("membros").select("user_id,nome,email").not("user_id","is",null).order("nome",{ascending:true});MEMBROS_LOGIN=ml.data||[];}catch(e){}
  INDS={};try{var im=await sb.from("importadora_membros").select("importadora_id,nome,ano,nucleo,tipo").order("ano",{ascending:false});(im.data||[]).forEach(function(r){(INDS[r.importadora_id]=INDS[r.importadora_id]||[]).push(r);});}catch(e){}
  render();}
async function init(){var u=(await sb.auth.getUser()).data.user;if(!u){st("needLogin");return;}
  var ic=await sb.rpc("is_conselho");if(ic.error||!ic.data){st("notAllowed");return;}
  st("panel");await carregar();}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
