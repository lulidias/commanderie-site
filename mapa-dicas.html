function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function popHtml(d){
  var L=[];
  if(d.end)L.push('<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.end)+'" target="_blank" rel="noopener">rota no Google Maps</a>');
