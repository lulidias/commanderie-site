<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simular custo de evento — Commanderie de Bordeaux</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><meta name="theme-color" content="#1e2a56">
<style>
:root{--navy:#1e2a56;--gold:#b08a3a;--cream:#f8f3e6;--line:#ddd0ad;--ink:#2a2620;--red:#8f1d24;--green:#2f6b3a;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.dtop img{width:34px;}.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.back{margin-left:auto;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);border:1px solid var(--gold);border-radius:20px;padding:7px 14px;text-decoration:none;white-space:nowrap;}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 70px;}
h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:28px;margin:8px 0 2px;text-align:center;}
.sub{text-align:center;color:#8a8270;font-size:13px;margin-bottom:14px;}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;}
.btn.g{background:transparent;color:var(--navy);border:1.5px solid var(--gold);}
.btn.v{background:var(--green);}
.btn.r{background:transparent;color:var(--red);border:1px solid #e3c4c4;}
.inp{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}.side{position:static!important;}}
.sec{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.sec h2{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:19px;margin:0 0 2px;display:flex;align-items:center;gap:8px;}
.sec h2 i{font-style:normal;display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#f3e3bd;font-size:13px;align-items:center;justify-content:center;font-family:Arial;}
.sec .d{font-size:12.5px;color:#8a8270;margin:0 0 10px 34px;}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
label.l span{display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;margin-bottom:3px;}
label.l .inp{width:100%;}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.pc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;}
.pc.pg{border-left:4px solid var(--green);}.pc.co{border-left:4px solid var(--gold);}
.pc b{display:block;font-size:13.5px;color:var(--navy);}
.pc small{display:block;font-size:11.5px;color:#8a8270;margin-bottom:6px;}
.st{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.st button{border:none;background:#f6efdc;color:var(--navy);width:34px;height:36px;font-size:19px;cursor:pointer;font-family:inherit;}
.st button:active{background:#eadfbf;}
.st input{width:62px;border:none;text-align:center;font-size:16px;height:36px;font-family:inherit;color:var(--ink);}
.st.sm button{width:28px;height:30px;font-size:16px;}.st.sm input{width:46px;height:30px;font-size:14px;}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
th,td{padding:6px 6px;border-bottom:1px solid #ece0c2;text-align:left;vertical-align:middle;}
th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;font-weight:normal;}
td.n,th.n{text-align:right;white-space:nowrap;}
.money{position:relative;display:inline-block;}
.money:before{content:"R$";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:#9a937f;}
.money input{padding-left:30px;width:130px;text-align:right;}
.x{color:#b0402f;cursor:pointer;font-size:18px;padding:0 4px;border:none;background:none;}
.add{color:var(--navy);cursor:pointer;font-size:13px;border:1.5px dashed var(--gold);border-radius:9px;padding:7px 12px;background:transparent;font-family:inherit;}
.sub2{display:flex;justify-content:space-between;font-size:13.5px;color:#5b5446;padding-top:8px;}
.sub2 b{color:var(--navy);}
.side{position:sticky;top:72px;}
.res{background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.res h3{margin:0 0 8px;font-family:Georgia,serif;font-weight:normal;font-size:18px;color:#f3e3bd;}
.res .row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1);}
.res .row b{font-weight:normal;}
.res .tot{font-size:16px;border-bottom:none;padding-top:8px;}
.res .tot b{font-family:Georgia,serif;font-size:22px;color:#fff;}
.big{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.big .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;}
.big .v{font-family:Georgia,serif;font-size:26px;color:var(--navy);}
.ok{color:var(--green)!important;}.bad{color:var(--red)!important;}
.pill{display:inline-block;border-radius:20px;padding:4px 11px;font-size:12.5px;}
.pill.ok{background:#eef6ef;border:1px solid #cfe6d3;}.pill.bad{background:#fbeeee;border:1px solid #ecc9c9;}
.hint{font-size:12px;color:#8a8270;line-height:1.5;}
.sens td,.sens th{padding:5px 6px;font-size:12.5px;}
.sens tr.me td{background:#f6efdc;font-weight:bold;}
.cat{font-size:11px;border-radius:8px;padding:2px 8px;white-space:nowrap;}
.c-mp{background:#eef6ef;color:#2f6b3a;}.c-cp{background:#e8edf8;color:#1e2a56;}.c-mc{background:#f6efdc;color:#8a6a1f;}.c-cc{background:#f3e8e8;color:#8f1d24;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.tag{font-size:10.5px;color:#9a937f;}
</style></head><body>
<div class="dtop"><a href="painel-conselho.html?sec=eventos"><img src="img/brasao.png" alt=""></a><b>Simular custo de evento</b><a class="back" href="painel-conselho.html?sec=eventos">&#8592; Eventos</a></div>
<div id="st" class="state">Carregando…</div>
<div id="app" class="wrap" style="display:none;">
  <h1>Simulação de custo do evento</h1>
  <div class="sub">Preencha os custos e as pessoas — o sistema calcula o rateio necessário para cobrir todas as despesas.</div>
  <div class="bar">
    <select class="inp" id="selSim" onchange="abrirSim(this.value)" style="flex:1;min-width:200px;"></select>
    <button class="btn g" onclick="novaSim()">+ Nova</button>
    <button class="btn v" onclick="salvarSim()">&#128190; Salvar</button>
    <button class="btn g" onclick="duplicarSim()">Duplicar</button>
    <button class="btn g" onclick="imprimir()">&#128424; Imprimir</button>
    <button class="btn r" onclick="excluirSim()">Excluir</button>
    <span id="msg" style="font-size:12.5px;"></span>
  </div>
  <div class="grid">
    <div id="form"></div>
    <div class="side" id="side"></div>
  </div>
</div>
<datalist id="dlMemb"></datalist>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://yvdkaycwtulqjnvlpgvy.supabase.co","sb_publishable_v3QZOo0NYLpOAk9p5JBNjQ_r0vb-Zjd");
var SIMS=[],ADEGA=[],MEMB=[],CUR=null,S=null,SUJO=false;
var CATS={mp:"Membro (paga)",cp:"Convidado (paga)",mc:"Membro / Conselho (não paga)",cc:"Convidado de cortesia (não paga)"};
var CUSTOS_PADRAO=[["Gráfica (convites, menus, cartões)","fixo"],["Material de comunicação","fixo"],["Locação de material (taças, mesas, toalhas)","fixo"],["Flores e decoração","fixo"],["Músico","fixo"],["Fotógrafo","fixo"],["Transporte / frete dos vinhos","fixo"],["Taxa de rolha / serviço de sommelier","fixo"],["Brindes, medalhas e diplomas","fixo"]];
function novoS(){return {titulo:"",data:"",local:"",tipo:"Jantar",preco_pessoa:0,servico_pct:10,p:{mp:20,cp:5,mc:4,cc:2},vinhos:[],custos:CUSTOS_PADRAO.map(function(c){return {nome:c[0],valor:0,modo:c[1]};}),imprevistos_pct:5,valor_membro:0,valor_convidado:0,arred:10,lista:[],obs:""};}
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(v){if(typeof v==="number")return v;v=(""+(v||"")).trim();if(!v)return 0;if(v.indexOf(",")>=0)v=v.replace(/\./g,"").replace(",",".");return Number(v)||0;}
function brl(n){return "R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function brl0(n){return "R$ "+Math.round(Number(n)||0).toLocaleString("pt-BR");}
function fv(n){n=Number(n)||0;return n?n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";}
function fdat(d){return d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";}
// ---------- cálculo ----------
function calc(X){X=X||S;var p=X.p,P=(p.mp||0)+(p.cp||0)+(p.mc||0)+(p.cc||0),pag=(p.mp||0)+(p.cp||0);
  var porPessoaRest=num(X.preco_pessoa)*(1+num(X.servico_pct)/100);
  var rest=porPessoaRest*P;
  var vin=0,garr=0;X.vinhos.forEach(function(v){garr+=v.qtd||0;if(!v.pago)vin+=(v.qtd||0)*num(v.preco);});
  var fixos=0,porPes=0;X.custos.forEach(function(c){if(c.modo==="pessoa")porPes+=num(c.valor);else fixos+=num(c.valor);});
  var outros=fixos+porPes*P;
  var sub=rest+vin+outros;var impr=sub*num(X.imprevistos_pct)/100;var total=sub+impr;
  var f=1+num(X.imprevistos_pct)/100;
  var custoVar=(porPessoaRest+porPes)*f; // custo de cada pessoa a mais
  var custoFixo=(vin+fixos)*f;
  var vc=num(X.valor_convidado),vm=num(X.valor_membro),ar=num(X.arred)||1;
  var igual=pag?total/pag:0;
  var nec=(p.mp||0)?(total-(p.cp||0)*vc)/(p.mp||0):0;
  var arrec=(p.mp||0)*vm+(p.cp||0)*vc;var resultado=arrec-total;
  var minM=null;if(vm>custoVar){minM=Math.max(0,Math.ceil((custoFixo+custoVar*((p.cp||0)+(p.mc||0)+(p.cc||0))-(p.cp||0)*vc)/(vm-custoVar)));}
  return {P:P,pag:pag,rest:rest,porPessoaRest:porPessoaRest,vin:vin,garr:garr,fixos:fixos,porPes:porPes,outros:outros,sub:sub,impr:impr,total:total,porPessoa:P?total/P:0,igual:igual,nec:nec,arrec:arrec,resultado:resultado,minM:minM,custoVar:custoVar,custoFixo:custoFixo,ar:ar};}
function arred(v,a){a=a||10;return Math.ceil((v-0.0001)/a)*a;}
// ---------- carregar ----------
async function init(){var u=(await sb.auth.getUser()).data.user;if(!u){document.getElementById("st").innerHTML="Entre na sua conta do Conselho. <a href='index.html?login=1'>Entrar</a>";return;}
  var q=await sb.from("evento_simulacoes").select("*").order("updated_at",{ascending:false});
  if(q.error){document.getElementById("st").innerHTML="Rode o SQL <b>evento_simulacoes.sql</b> no Supabase. ("+esc(q.error.message)+")";return;}
  SIMS=q.data||[];
  var a=await sb.from("adega_vinhos").select("*").order("ordem",{ascending:true});var ai=await sb.from("adega_saida_itens").select("vinho_id,qtd");
  if(!a.error){var sd={};(ai.data||[]).forEach(function(i){sd[i.vinho_id]=(sd[i.vinho_id]||0)+i.qtd;});ADEGA=(a.data||[]).map(function(v){v.est=(Number(v.adquirido)||0)-(sd[v.id]||0);return v;}).filter(function(v){return v.est>0;});}
  var m=await sb.from("membros").select("nome").order("nome",{ascending:true});MEMB=(m.data||[]).map(function(x){return x.nome;}).filter(Boolean);
  document.getElementById("dlMemb").innerHTML=MEMB.map(function(n){return "<option value=\""+esc(n)+"\">";}).join("");
  document.getElementById("st").style.display="none";document.getElementById("app").style.display="block";
  var id=new URLSearchParams(location.search).get("id");
  if(id&&SIMS.some(function(x){return x.id===id;}))abrirSim(id);else if(SIMS.length)abrirSim(SIMS[0].id);else novaSim(true);}
function listaSel(){document.getElementById("selSim").innerHTML=(CUR?"":"<option value=''>— Nova simulação (ainda não salva) —</option>")+SIMS.map(function(x){return "<option value='"+x.id+"'"+(CUR===x.id?" selected":"")+">"+esc(x.titulo||"Sem título")+(x.data?(" · "+new Date(x.data+"T12:00:00").toLocaleDateString("pt-BR")):"")+"</option>";}).join("");}
function abrirSim(id){if(!id)return;if(SUJO&&!confirm("Há alterações não salvas. Abrir outra simulação mesmo assim?")){listaSel();return;}var x=SIMS.find(function(s){return s.id===id;});if(!x)return;CUR=id;S=Object.assign(novoS(),JSON.parse(JSON.stringify(x.dados||{})));S.titulo=x.titulo;S.data=x.data||"";SUJO=false;listaSel();render();}
function novaSim(silent){if(!silent&&SUJO&&!confirm("Há alterações não salvas. Começar uma nova mesmo assim?"))return;CUR=null;S=novoS();SUJO=false;listaSel();render();}
function duplicarSim(){S=JSON.parse(JSON.stringify(S));S.titulo=(S.titulo||"Simulação")+" (cópia)";CUR=null;SUJO=true;listaSel();render();msg("Cópia criada — ajuste e clique em Salvar.","#5b5446");}
async function salvarSim(){if(!S.titulo.trim()){msg("Dê um nome ao evento (item 1).","#8f1d24");var t=document.getElementById("f_titulo");if(t)t.focus();return;}
  var d=JSON.parse(JSON.stringify(S));var rec={titulo:S.titulo.trim(),data:S.data||null,dados:d,updated_at:new Date().toISOString()};
  var r=CUR?await sb.from("evento_simulacoes").update(rec).eq("id",CUR).select("*").single():await sb.from("evento_simulacoes").insert(rec).select("*").single();
  if(r.error){msg("Erro: "+r.error.message,"#8f1d24");return;}
  var x=r.data;SIMS=SIMS.filter(function(s){return s.id!==x.id;});SIMS.unshift(x);CUR=x.id;SUJO=false;listaSel();side();msg("✔ Salvo","#2f6b3a");}
async function excluirSim(){if(!CUR){novaSim(true);return;}if(!confirm("Excluir a simulação \""+S.titulo+"\"?"))return;var r=await sb.from("evento_simulacoes").delete().eq("id",CUR);if(r.error){msg("Erro: "+r.error.message,"#8f1d24");return;}SIMS=SIMS.filter(function(s){return s.id!==CUR;});SUJO=false;if(SIMS.length)abrirSim(SIMS[0].id);else novaSim(true);msg("Excluída.","#5b5446");}
function msg(t,c){var m=document.getElementById("msg");m.style.color=c||"#5b5446";m.textContent=t;clearTimeout(window._mt);window._mt=setTimeout(function(){m.textContent="";},4000);}
// ---------- edição ----------
function set(path,v,re){var o=S,k=path.split(".");for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;SUJO=true;if(re)render();else side();}
function stepper(path,val,sm){return "<span class='st"+(sm?" sm":"")+"'><button type='button' onclick=\"stp('"+path+"',-1)\">−</button><input inputmode='numeric' value='"+(val||0)+"' oninput=\"set('"+path+"',Math.max(0,parseInt(this.value,10)||0))\" onblur='render()'><button type='button' onclick=\"stp('"+path+"',1)\">+</button></span>";}
function stp(path,d){var o=S,k=path.split(".");for(var i=0;i<k.length-1;i++)o=o[k[i]];var n=Math.max(0,(parseInt(o[k[k.length-1]],10)||0)+d);o[k[k.length-1]]=n;SUJO=true;render();}
function money(path,val,w){return "<span class='money'><input class='inp' inputmode='decimal' value='"+fv(val)+"' placeholder='0,00' style='"+(w?("width:"+w+"px;"):"")+"' oninput=\"set('"+path+"',num(this.value))\" onblur='render()'></span>";}
function render(){var C=calc();var p=S.p;var h="";
  h+="<div class='sec'><h2><i>1</i>Evento</h2><div class='d'>Nome, data e tipo do evento.</div><div class='f2'>"
    +"<label class='l' style='grid-column:1/-1;'><span>Nome do evento *</span><input class='inp' id='f_titulo' value='"+esc(S.titulo)+"' placeholder='Ex.: Capítulo XI · Jantar de entronização' oninput=\"set('titulo',this.value)\"></label>"
    +"<label class='l'><span>Data</span><input class='inp' type='date' value='"+esc(S.data)+"' oninput=\"set('data',this.value)\"></label>"
    +"<label class='l'><span>Tipo</span><select class='inp' onchange=\"set('tipo',this.value)\">"+["Jantar","Almoço","Degustação","Coquetel"].map(function(t){return "<option"+(S.tipo===t?" selected":"")+">"+t+"</option>";}).join("")+"</select></label>"
    +"<label class='l' style='grid-column:span 2;'><span>Local / restaurante</span><input class='inp' value='"+esc(S.local)+"' placeholder='Ex.: Piselli Boa Vista' oninput=\"set('local',this.value)\"></label></div></div>";
  h+="<div class='sec'><h2><i>2</i>Pessoas</h2><div class='d'>Quantas pessoas devem vir. Use − e + para simular mais ou menos gente.</div><div class='pp'>"
    +"<div class='pc pg'><b>Membros que pagam</b><small>pagam o valor de membro</small>"+stepper("p.mp",p.mp)+"</div>"
    +"<div class='pc pg'><b>Convidados que pagam</b><small>pagam o valor de convidado</small>"+stepper("p.cp",p.cp)+"</div>"
    +"<div class='pc co'><b>Membros / Conselho que não pagam</b><small>Grão-Mestre, Mestres, anfitrião…</small>"+stepper("p.mc",p.mc)+"</div>"
    +"<div class='pc co'><b>Convidados que não pagam</b><small>cortesia: palestrante, imprensa, produtor…</small>"+stepper("p.cc",p.cc)+"</div>"
    +"</div><div class='sub2'><span>Total de pessoas no evento</span><b>"+C.P+" pessoas · "+C.pag+" pagantes · "+(C.P-C.pag)+" cortesias</b></div></div>";
  h+="<div class='sec'><h2><i>3</i>"+esc(S.tipo)+" (restaurante)</h2><div class='d'>Preço por pessoa cobrado pelo restaurante. Conta todas as pessoas, inclusive as cortesias.</div><div class='f2'>"
    +"<label class='l'><span>Preço por pessoa</span>"+money("preco_pessoa",S.preco_pessoa,150)+"</label>"
    +"<label class='l'><span>Taxa de serviço (%)</span><input class='inp' inputmode='decimal' value='"+num(S.servico_pct)+"' oninput=\"set('servico_pct',num(this.value))\" onblur='render()' style='width:90px;'></label></div>"
    +"<div class='sub2'><span>"+brl(C.porPessoaRest)+" × "+C.P+" pessoas</span><b>"+brl(C.rest)+"</b></div></div>";
  // vinhos
  h+="<div class='sec'><h2><i>4</i>Vinhos</h2><div class='d'>Acrescente os vinhos. Pode puxar da Adega da Commanderie (já vem com o valor de aquisição) ou digitar outro.</div>";
  h+=S.vinhos.length?("<table><thead><tr><th>Vinho</th><th>Garrafas</th><th>Preço/gf</th><th class='n'>Total</th><th></th></tr></thead><tbody>"+S.vinhos.map(function(v,i){return "<tr><td><input class='inp' value='"+esc(v.nome)+"' placeholder='Nome do vinho' oninput=\"set('vinhos."+i+".nome',this.value)\" style='width:100%;min-width:150px;'>"+(v.adega?("<div class='tag'>da Adega · "+v.est+" em estoque"+(v.qtd>v.est?" <b style='color:#8f1d24;'>· mais do que tem!</b>":"")+"</div>"):"")+"<label class='tag' style='display:inline-flex;gap:4px;align-items:center;cursor:pointer;margin-top:3px;'><input type='checkbox' "+(v.pago?"checked":"")+" onchange=\"set('vinhos."+i+".pago',this.checked,1)\" style='width:auto;'> já pago (não entra no custo)</label></td><td>"+stepper("vinhos."+i+".qtd",v.qtd,1)+"</td><td>"+money("vinhos."+i+".preco",v.preco,110)+"</td><td class='n'>"+(v.pago?"<span class='tag'>já pago</span>":brl((v.qtd||0)*num(v.preco)))+"</td><td><button class='x' title='Tirar' onclick='S.vinhos.splice("+i+",1);SUJO=true;render()'>×</button></td></tr>";}).join("")+"</tbody></table>"):"";
  h+="<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;'><button class='add' onclick=\"S.vinhos.push({nome:'',qtd:6,preco:0});SUJO=true;render()\">+ Vinho</button>"
