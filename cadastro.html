<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu cadastro — Commanderie de Bordeaux</title><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png"><link rel="apple-touch-icon" href="img/favicon-180.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#1e2a56"><meta name="apple-mobile-web-app-title" content="Commanderie">
<style>
:root{--parch:#f3ecd9;--parch2:#ece3cd;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;cursor:pointer;transition:all .15s ease;}.dtop .back:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.dhead{text-align:center;padding:34px 20px 4px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:32px;margin:6px 0 2px;}
.wrap{max-width:680px;margin:0 auto;padding:14px 20px 60px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.cadlbl{display:block;font-size:12px;color:#8a8270;margin-bottom:4px;}
.authmsg{font-size:13px;margin-top:6px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
</style></head><body>
<div class="dtop"><img src="img/brasao.png" alt="Brasão"><b>Meu cadastro</b><a class="back" href="index.html" onclick="if(history.length>1){history.back();return false;}">&#8592; Voltar</a></div>
<div id="needLogin" class="state" style="display:none;"><h2>Acesso restrito</h2><p>Entre na sua conta para acessar seu cadastro.</p><a class="btn" href="index.html">Entrar</a></div>
<div id="loading" class="state">Carregando…</div>
<div id="content" style="display:none;">
  <div class="dhead"><div class="k">Comendador</div><h1>Meu cadastro</h1></div>
  <div class="wrap"><div class="card">
    <p style="font-size:13.5px;color:#5b5446;line-height:1.55;margin:0 0 12px;">Seus dados de membro. O <b>e-mail é o seu login</b> e não pode ser alterado aqui.</p>
    <div style="text-align:center;margin:6px 0 14px;"><div id="fotoStage" style="width:170px;height:170px;border-radius:50%;overflow:hidden;position:relative;margin:0 auto;background:#efe9da;border:2px solid var(--gold);cursor:grab;touch-action:none;"><img id="fotoImg" alt="" style="position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;display:none;"><img id="fotoAtual" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;"><div id="fotoHint" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a8270;font-size:13px;">sem foto</div></div><input type="range" id="fotoZoom" min="1" max="3" step="0.01" value="1" style="width:170px;display:none;margin:12px auto 6px;"><div><label style="cursor:pointer;display:inline-block;margin-top:8px;background:transparent;color:var(--navy);border:1.5px solid var(--gold);border-radius:11px;padding:8px 14px;font-size:13px;">Escolher / trocar foto<input id="fotoFile" type="file" accept="image/*" style="display:none"></label></div><div id="fotoMsg" class="authmsg" style="text-align:center;"></div></div>
    <label class="cadlbl">Nome completo</label><input id="cadNome" placeholder="Nome completo" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <label class="cadlbl">E-mail (login)</label><input id="cadEmail" type="email" readonly style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;background:#f3efe4;color:#8a8270;">
    <label class="cadlbl">Telefone</label><div style="display:flex;gap:8px;"><select id="cadDDI" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;flex:0 0 140px;"><option value="+55">Brasil +55</option><option value="+351">Portugal +351</option><option value="+33">França +33</option><option value="+1">EUA/Canadá +1</option><option value="+44">Reino Unido +44</option><option value="+34">Espanha +34</option><option value="+39">Itália +39</option><option value="+49">Alemanha +49</option><option value="+41">Suíça +41</option><option value="+32">Bélgica +32</option><option value="+54">Argentina +54</option><option value="+56">Chile +56</option><option value="+598">Uruguai +598</option><option value="+52">México +52</option><option value="+81">Japão +81</option><option value="+86">China +86</option><option value="+61">Austrália +61</option><option value="+971">Emirados +971</option></select><input id="cadTelefone" placeholder="(DDD) número" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;flex:1;"></div>
    <label class="cadlbl">Documento (CPF, passaporte, etc.)</label><input id="cadDoc" placeholder="CPF, passaporte ou outro documento" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <label class="cadlbl">Endereço (rua, número, complemento)</label><input id="cadEndereco" placeholder="Rua, número, complemento" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <label class="cadlbl">Bairro</label><input id="cadBairro" placeholder="Bairro" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <label class="cadlbl">Cidade / Estado</label><input id="cadCidade" placeholder="Cidade / UF" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <label class="cadlbl">CEP / Código postal</label><input id="cadCEP" placeholder="CEP ou código postal" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <label class="cadlbl">País</label><input id="cadPais" placeholder="País" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;">
    <a href="#" onclick="salvarCadastro();return false;" style="display:inline-block;text-decoration:none;background:var(--navy);color:#fff;border-radius:11px;padding:11px 18px;font-size:15px;">Salvar cadastro</a><div id="cadOk" style="margin-top:10px;font-size:13.5px;"></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var membroAtual=null;
var fotoV=170,fNW=0,fNH=0,fBase=1,fZoom=1,fOX=0,fOY=0,fImg=null,fStage=null,fotoNova=false;
async function uploadFotoSeNova(){if(!fotoNova||!fImg||fImg.style.display==="none")return null;var scale=fBase*fZoom,OUT=320;var cv=document.createElement("canvas");cv.width=OUT;cv.height=OUT;var cx=cv.getContext("2d");cx.drawImage(fImg,(0-fOX)/scale,(0-fOY)/scale,fotoV/scale,fotoV/scale,0,0,OUT,OUT);var blob=await new Promise(function(res){cv.toBlob(res,"image/jpeg",0.9);});var u=(await sb.auth.getUser()).data.user;if(!u)return null;var path=u.id+".jpg";var up=await sb.storage.from("fotos").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(up.error)throw up.error;return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;}
function fotoApply(){var dw=fNW*fBase*fZoom,dh=fNH*fBase*fZoom;if(fOX>0)fOX=0;if(fOY>0)fOY=0;if(fOX<fotoV-dw)fOX=fotoV-dw;if(fOY<fotoV-dh)fOY=fotoV-dh;fImg.style.width=dw+"px";fImg.style.height=dh+"px";fImg.style.left=fOX+"px";fImg.style.top=fOY+"px";}
function fotoLoad(src){fImg.onload=function(){fNW=fImg.naturalWidth;fNH=fImg.naturalHeight;fBase=Math.max(fotoV/fNW,fotoV/fNH);fZoom=1;var z=document.getElementById("fotoZoom");if(z){z.value=1;z.style.display="block";}var dw=fNW*fBase,dh=fNH*fBase;fOX=(fotoV-dw)/2;fOY=(fotoV-dh)/2;fImg.style.display="block";document.getElementById("fotoAtual").style.display="none";document.getElementById("fotoHint").style.display="none";fotoNova=true;fotoApply();};fImg.src=src;}
function fotoInit(){fImg=document.getElementById("fotoImg");fStage=document.getElementById("fotoStage");if(!fStage)return;document.getElementById("fotoFile").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){fotoLoad(e.target.result);};r.readAsDataURL(f);});document.getElementById("fotoZoom").addEventListener("input",function(){if(fImg.style.display==="none")return;var dwo=fNW*fBase*fZoom,dho=fNH*fBase*fZoom;var fx=(fotoV/2-fOX)/dwo,fy=(fotoV/2-fOY)/dho;fZoom=parseFloat(this.value);var dwn=fNW*fBase*fZoom,dhn=fNH*fBase*fZoom;fOX=fotoV/2-fx*dwn;fOY=fotoV/2-fy*dhn;fotoApply();});var drag=false,px=0,py=0;fStage.addEventListener("pointerdown",function(ev){if(fImg.style.display==="none")return;drag=true;px=ev.clientX;py=ev.clientY;fStage.setPointerCapture(ev.pointerId);fStage.style.cursor="grabbing";});fStage.addEventListener("pointermove",function(ev){if(!drag)return;fOX+=ev.clientX-px;fOY+=ev.clientY-py;px=ev.clientX;py=ev.clientY;fotoApply();});fStage.addEventListener("pointerup",function(ev){drag=false;fStage.style.cursor="grab";});}
function fotoPrepEdit(){if(!fImg)return;fImg.style.display="none";fotoNova=false;var z=document.getElementById("fotoZoom");if(z)z.style.display="none";var at=document.getElementById("fotoAtual"),hint=document.getElementById("fotoHint");if(membroAtual&&membroAtual.foto_url){at.src=membroAtual.foto_url+"?t="+Date.now();at.style.display="block";hint.style.display="none";}else{at.style.display="none";hint.style.display="flex";}var fm=document.getElementById("fotoMsg");if(fm)fm.textContent="";}
async function salvarCadastro(){var o=document.getElementById("cadOk");var nome=document.getElementById("cadNome").value.trim();if(!nome){o.style.color="#8f1d24";o.textContent="O nome não pode ficar vazio.";return;}o.style.color="#2f6b3a";o.textContent="Salvando...";var g=function(id){var e=document.getElementById(id);return e?e.value.trim():null;};var payload={nome:nome,telefone_ddi:g("cadDDI"),telefone:g("cadTelefone"),documento:g("cadDoc"),endereco:g("cadEndereco"),bairro:g("cadBairro"),cidade:g("cadCidade"),cep:g("cadCEP"),pais:g("cadPais")};var u=(await sb.auth.getUser()).data.user;if(!u){o.style.color="#8f1d24";o.textContent="Sessão expirada. Faça login novamente.";return;}try{var furl=await uploadFotoSeNova();if(furl)payload.foto_url=furl;}catch(e){o.style.color="#8f1d24";o.textContent="Erro ao enviar a foto: "+(e.message||e);return;}var r=await sb.from("membros").update(payload).eq("user_id",u.id);if(r.error){o.style.color="#8f1d24";o.textContent="Erro ao salvar: "+r.error.message;return;}for(var k in payload){membroAtual[k]=payload[k];}o.style.color="#2f6b3a";o.textContent="Cadastro salvo!";fotoPrepEdit();}
async function carregar(){var u=(await sb.auth.getUser()).data.user;document.getElementById("loading").style.display="none";if(!u){document.getElementById("needLogin").style.display="block";return;}var q=await sb.from("membros").select("*").eq("user_id",u.id).maybeSingle();if(q.error||!q.data){document.getElementById("needLogin").style.display="block";return;}membroAtual=q.data;var m=q.data;var V=function(id,val){var e=document.getElementById(id);if(e)e.value=(val==null?"":val);};V("cadNome",m.nome);V("cadEmail",m.email);V("cadDoc",m.documento);V("cadEndereco",m.endereco);V("cadBairro",m.bairro);V("cadCidade",m.cidade);V("cadCEP",m.cep);V("cadPais",m.pais||"Brasil");if(m.telefone_ddi){var dd=document.getElementById("cadDDI");if(dd)dd.value=m.telefone_ddi;}V("cadTelefone",m.telefone);document.getElementById("content").style.display="block";fotoInit();fotoPrepEdit();}
document.addEventListener("DOMContentLoaded",carregar);
</script></body></html>
