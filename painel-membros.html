<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membros — Commanderie de Bordeaux</title><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><meta name="theme-color" content="#1e2a56">
<style>
:root{--parch:#f3ecd9;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;cursor:pointer;}.dtop .back:hover{background:var(--navy);color:#fff;}
.dhead{text-align:center;padding:28px 20px 4px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:30px;margin:6px 0 2px;}
.wrap{max-width:900px;margin:0 auto;padding:14px 20px 60px;}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.inp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
.nuctitle{font-family:Georgia,serif;color:var(--navy);font-size:19px;font-weight:normal;margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;}
.mcard{background:#fffdf7;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.mhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;}
.mav{width:40px;height:40px;border-radius:50%;background:#f6efdc;border:1px solid #e6d9b3;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:Georgia,serif;font-size:16px;flex:none;overflow:hidden;}
.mav img{width:100%;height:100%;object-fit:cover;}
.mname{font-family:Georgia,serif;color:var(--navy);font-size:15.5px;}
.mmeta{font-size:12px;color:#8a8270;margin-top:1px;}
.pill{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 9px;white-space:nowrap;}
.p-pago{color:#2f6b3a;background:#eef6ef;border:1px solid #cfe6d3;} .p-aberto{color:#8a6a1f;background:#f6efdc;border:1px solid var(--line);} .p-isento{color:#5b5446;background:#efe9da;border:1px solid var(--line);}
.mbody{display:none;border-top:1px solid #ece0c2;padding:14px;background:#fcf9f0;}
.grp{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:bold;margin:4px 0 8px;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;}
.kv .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;}
.kv .v{font-size:13.5px;color:#2a2620;white-space:pre-wrap;}
.fichabox{margin-top:12px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
</style></head><body>
<div class="dtop"><a href="painel-conselho.html" style="display:inline-flex;align-items:center;" title="Painel do Conselho"><img src="img/brasao.png" alt="Brasão"></a><b>Membros</b><a class="back" href="painel-conselho.html">&#8592; Voltar</a></div>
<div id="needLogin" class="state" style="display:none;"><h2>Acesso restrito</h2><p>Entre na sua conta para acessar.</p><a class="btn" href="index.html">Entrar</a></div>
<div id="notAllowed" class="state" style="display:none;"><h2>Apenas o Conselho</h2><p>Esta página é exclusiva para Mestres e Grão-Mestre.</p><a class="btn" href="index.html">Voltar</a></div>
<div id="loading" class="state">Carregando…</div>
<div id="panel" style="display:none;">
  <div class="dhead"><div class="k">Conselho</div><h1>Membros</h1><div class="sub" style="font-size:13px;color:#8a8270;" id="resumo"></div></div>
  <div class="wrap">
    <div class="tools"><input class="inp" id="busca" placeholder="Buscar por nome, e-mail, código…" oninput="render()" style="flex:1;min-width:200px;"><select class="inp" id="fNucleo" onchange="render()"><option value="">Todos os núcleos</option><option>São Paulo</option><option>Rio de Janeiro</option><option>Porto Alegre</option><option>Curitiba</option><option>Recife</option></select></div>
    <div id="lista"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var MEMBROS=[];
function st(id){["needLogin","notAllowed","loading","panel"].forEach(function(x){var e=document.getElementById(x);if(e)e.style.display=(x===id)?"block":"none";});}
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fdata(d){if(!d)return "";var p=(""+d).split("T")[0].split("-");return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d;}
function ini(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"")).toUpperCase();}
function nrm(s){return (""+(s||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function anuidadePill(m){var g=(""+(m.grau||"")).toLowerCase();if(g.indexOf("honra")>=0||g.indexOf("mestre")>=0)return "<span class=\"pill p-isento\">Isento</span>";if(m.anuidade_paga)return "<span class=\"pill p-pago\">Anuidade em dia</span>";return "<span class=\"pill p-aberto\">"+esc(m.anuidade_status||"Em aberto")+"</span>";}
function row(k,v){if(v==null||v==="")return "";return "<div><div class=\"k\">"+esc(k)+"</div><div class=\"v\">"+esc(v)+"</div></div>";}
function fichaHtml(f){if(!f)return "<div style=\"font-size:12.5px;color:#9a937f;\">Ficha de entronização ainda não preenchida.</div>";
  var L=[["Tratamento",f.tratamento],["Nascimento",fdata(f.nascimento)],["Nacionalidade",f.nacionalidade],["Profissão",f.profissao],["Restrições alimentares",f.restricoes],["1º Padrinho",f.padrinho1],["2º Padrinho",f.padrinho2],["Mestre que aprovou",f.mestre],["Atividades e interesses",f.atividades],["Biografia",f.biografia],["Honrarias e confrarias",f.honrarias],["Ligação com Bordeaux",f.ligacao_bordeaux],["Primeiro Bordeaux",f.primeiro_bordeaux],["Bordeaux preferido",f.bordeaux_preferido],["Experiência memorável",f.experiencia],["Outras histórias",f.outras_historias],["Local e data",f.local_data]];
  return "<div class=\"grp\">Ficha de Entronização</div><div class=\"kv\">"+L.map(function(x){return row(x[0],x[1]);}).join("")+"</div>";}
function ucfirst(s){s=(""+(s||"")).trim();return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function lcfirst(s){s=(""+(s||"")).trim();return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function pnome(n){return (""+(n||"")).trim().split(/\s+/)[0]||n;}
function textoIntro(m){
  var f=m.ficha;if(!f)return "";
  var nome=m.nome||((f.nome||"")+" "+(f.sobrenome||"")).trim();var pn=pnome(nome);
  var s=[];
  s.push("Senhoras e senhores Comendadores, é com grande honra que a Commanderie de Bordeaux do Brasil recebe hoje, no núcleo "+esc(f.nucleo||m.nucleo||"—")+", <b>"+esc(nome)+"</b>.");
  if(f.profissao)s.push(esc(pn)+", "+esc(lcfirst((""+f.profissao).replace(/\.+$/,"")))+", traz consigo uma trajetória que muito nos honra.");
  if(f.biografia)s.push(esc((""+f.biografia).trim()));
  if(f.ligacao_bordeaux)s.push("A sua ligação com Bordeaux revela-se em cada gesto: "+esc(lcfirst(f.ligacao_bordeaux)));
  if(f.primeiro_bordeaux)s.push("Guarda o seu primeiro Bordeaux — "+esc(lcfirst(f.primeiro_bordeaux))+" — como um instante precioso.");
  if(f.bordeaux_preferido)s.push("Entre todos os rótulos, é "+esc(f.bordeaux_preferido)+" que faz o seu coração bater mais forte.");
  if(f.experiencia)s.push("E há de recordar sempre aquela experiência inesquecível: "+esc(lcfirst(f.experiencia)));
  var ap=[f.padrinho1,f.padrinho2].filter(Boolean);var fr=[];
  if(ap.length)fr.push("apresentado por "+esc(ap.join(" e ")));
  if(f.mestre)fr.push("com a aprovação do Mestre "+esc(f.mestre));
  if(fr.length)s.push(ucfirst(fr.join(", "))+", "+esc(pn)+" cruza hoje o limiar da nossa confraria.");
  s.push("Que "+esc(pn)+" encontre aqui amizade, conhecimento e a alegria de celebrar, capítulo após capítulo, os grandes vinhos de Bordeaux. Erga a sua taça, caro Comendador, e repita conosco: <b>Bordeaux, toujours Bordeaux!</b>");
  return s.join(" ");
}
function copiarIntro(id){var el=document.getElementById("intro_"+id);if(!el)return;var t=el.innerText||el.textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);}
function card(m){
  var foto=m.foto_url?("<img src=\""+esc(m.foto_url)+"\" alt=\"\">"):esc(ini(m.nome));
  var tel=(m.telefone_ddi?m.telefone_ddi+" ":"")+(m.telefone||"");
  var contato=[m.email,tel].filter(Boolean).join(" · ");
  var meta=[m.grau,m.codigo].filter(Boolean).join(" · ");
  if(m.eleito&&m.data_intronizacao)meta+=" · Entronização "+fdata(m.data_intronizacao);
  var head="<div class=\"mhead\" onclick=\"toggle(this)\"><div class=\"mav\">"+foto+"</div><div style=\"flex:1;min-width:0;\"><div class=\"mname\">"+esc(m.nome)+"</div><div class=\"mmeta\">"+esc(meta)+(contato?(" · "+esc(contato)):"")+"</div></div>"+anuidadePill(m)+"</div>";
  var cad="<div class=\"grp\">Cadastro</div><div class=\"kv\">"+row("E-mail",m.email)+row("Telefone",tel)+row("Nascimento",fdata(m.nascimento))+row("Documento",m.documento)+row("Endereço",m.endereco)+row("Bairro",m.bairro)+row("Cidade",m.cidade)+row("CEP",m.cep)+row("País",m.pais)+row("Núcleo",m.nucleo)+row("Capítulo",m.capitulo)+row("Entronização",fdata(m.data_intronizacao))+"</div>";
  var texto=m.ficha?("<div class=\"grp\" style=\"margin-top:14px;\">Texto de Entronização <a onclick=\"copiarIntro('"+m.id+"')\" style=\"color:var(--navy);cursor:pointer;font-size:10px;font-weight:normal;text-transform:none;letter-spacing:0;margin-left:8px;\">copiar</a></div><div id=\"intro_"+m.id+"\" style=\"font-size:14px;color:#2a2620;line-height:1.75;background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-family:Georgia,serif;\">"+textoIntro(m)+"</div>"):"";
  var comp=m.comprovante_url?("<div style=\"margin-top:10px;\"><a href=\""+esc(m.comprovante_url)+"\" target=\"_blank\" style=\"color:var(--navy);font-size:13px;font-weight:bold;text-decoration:none;\">&#128206; Ver comprovante de pagamento</a></div>"):"";
  var body="<div class=\"mbody\">"+cad+comp+"<div class=\"fichabox\">"+fichaHtml(m.ficha)+"</div>"+texto+"</div>";
  return "<div class=\"mcard\">"+head+body+"</div>";
}
function toggle(el){var b=el.nextElementSibling;if(b)b.style.display=(b.style.display==="block")?"none":"block";}
function render(){
  var q=nrm(document.getElementById("busca").value);var nf=document.getElementById("fNucleo").value;
  var list=MEMBROS.filter(function(m){
    if(nf&&(m.nucleo||"")!==nf)return false;
    if(!q)return true;
    return nrm(m.nome+" "+(m.email||"")+" "+(m.codigo||"")+" "+(m.grau||"")).indexOf(q)>=0;
  });
  document.getElementById("resumo").textContent=list.length+" de "+MEMBROS.length+" membros";
  var topo=list.filter(aguardandoIntro).sort(function(a,b){return (""+(a.data_intronizacao||"")).localeCompare(""+(b.data_intronizacao||""));});
  var resto=list.filter(function(m){return !aguardandoIntro(m);});
  var html="";
  if(topo.length){html+="<div class=\"nuctitle\" style=\"color:var(--red);border-color:#e6cccc;\">Aguardando entronização <span style=\"font-size:12px;color:#8a8270;\">("+topo.length+")</span></div>"+topo.map(card).join("");}
  var ORD=["São Paulo","Rio de Janeiro","Porto Alegre","Curitiba","Recife"];
  var grupos={};resto.forEach(function(m){var k=m.nucleo||"Sem núcleo";(grupos[k]=grupos[k]||[]).push(m);});
  var chaves=Object.keys(grupos).sort(function(a,b){function rk(n){if(n==="Sem núcleo")return 100;var i=ORD.indexOf(n);return i<0?50:i;}var ra=rk(a),rb=rk(b);if(ra!==rb)return ra-rb;return a.localeCompare(b,"pt");});
  html+=chaves.map(function(k){return "<div class=\"nuctitle\">"+esc(k)+" <span style=\"font-size:12px;color:#8a8270;\">("+grupos[k].length+")</span></div>"+grupos[k].map(card).join("");}).join("");
  document.getElementById("lista").innerHTML=html||"<p style=\"color:#8a8270;font-size:13px;\">Nenhum membro encontrado.</p>";
}
function hojeISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function aguardandoIntro(m){var di=(""+(m.data_intronizacao||"")).split("T")[0];if(!di)return false;return di>=hojeISO();}
async function init(){
  var u=(await sb.auth.getUser()).data.user;if(!u){st("needLogin");return;}
  var ic=await sb.rpc("is_conselho");if(ic.error||!ic.data){st("notAllowed");return;}
  var q=await sb.rpc("membros_completo");
  if(q.error){document.getElementById("lista").innerHTML="<p style=\"color:#9a937f;\">(rode o SQL) "+esc(q.error.message)+"</p>";st("panel");return;}
  MEMBROS=q.data||[];st("panel");render();
}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
