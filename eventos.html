<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos — Commanderie de Bordeaux</title><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#1e2a56"><meta name="apple-mobile-web-app-title" content="Commanderie">
<style>
:root{--parch:#f3ecd9;--parch2:#ece3cd;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 2px 16px rgba(40,30,10,.05);}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;cursor:pointer;transition:all .15s ease;}.dtop .back:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.dhead{text-align:center;padding:38px 20px 6px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:36px;margin:6px 0 2px;}
.wrap{max-width:880px;margin:0 auto;padding:14px 20px 60px;}
.sec-title{font-family:Georgia,serif;color:var(--navy);font-size:22px;font-weight:normal;margin:30px 0 4px;}
.sec-rule{height:1px;background:var(--line);margin:0 0 16px;}
.evrow{display:flex;align-items:center;gap:14px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;box-shadow:0 4px 14px rgba(40,30,10,.05);}
.evdate{flex:none;width:54px;text-align:center;line-height:1;}
.evdate b{display:block;font-family:Georgia,serif;color:var(--navy);font-size:24px;}
.evdate span{display:block;font-size:11px;letter-spacing:1px;color:var(--red);font-weight:bold;margin-top:2px;}
.evdate small{display:block;font-size:10px;color:#9a937f;margin-top:1px;}
.evinfo{flex:1;min-width:0;}
.evtitle{font-family:Georgia,serif;color:var(--navy);font-size:16px;}
.evmeta{font-size:12px;color:#8a8270;margin-top:2px;}
.evbadge{flex:none;font-size:10px;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 10px;}
.evbadge.prox{color:#8a6a1f;background:#f6efdc;border:1px solid var(--line);}
.evbadge.real{color:#5b5446;background:#efe9da;border:1px solid var(--line);}
.evfotos{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:5px 13px;cursor:pointer;transition:all .15s ease;}
.evfotos:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.evrelato{font-size:13px;color:#5b5446;line-height:1.55;margin-top:5px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
</style></head><body>
<div class="dtop"><a href="index.html" style="display:inline-flex;align-items:center;" title="Painel do Comendador"><img src="img/brasao.png" alt="Brasão"></a><b data-i18n="ev_brand">Eventos</b><a class="back" href="index.html" data-i18n="ev_back">&#8592; Voltar</a><span class="lang-sel" id="langSel" style="display:inline-flex;gap:2px;margin-left:8px;font-size:11.5px;letter-spacing:.5px;"><a data-lang="pt" onclick="setLang('pt')" style="cursor:pointer;padding:2px 5px;">PT</a><a data-lang="en" onclick="setLang('en')" style="cursor:pointer;padding:2px 5px;">EN</a><a data-lang="fr" onclick="setLang('fr')" style="cursor:pointer;padding:2px 5px;">FR</a></span></div>
<div id="needLogin" class="state" style="display:none;"><h2 data-i18n="ev_nl_h">Acesso restrito</h2><p data-i18n="ev_nl_p">Entre na sua conta para ver os eventos.</p><a class="btn" href="index.html" data-i18n="ev_nl_btn">Entrar</a></div>
<div id="loading" class="state" data-i18n="ev_loading">Carregando…</div>
<div id="content" style="display:none;">
  <div class="dhead"><div class="k" data-i18n="ev_k">Confraria</div><h1 data-i18n="ev_h1">Eventos</h1><p style="max-width:540px;margin:0 auto;color:#5b5446;line-height:1.6;" data-i18n="ev_intro">Capítulos, viagens, jantares e almoços da Commanderie — realizados e por vir.</p></div>
  <div class="wrap" id="evWrap"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var GAL={};var LB=[];var LBi=0;
function lbOpen(id,i){LB=GAL[id]||[];LBi=i||0;if(!LB.length)return;document.getElementById("lightbox").style.display="flex";lbShow();}
function lbShow(){var img=document.getElementById("lightboxImg");if(img)img.src=LB[LBi];var c=document.getElementById("lbCount");if(c)c.textContent=(LBi+1)+" / "+LB.length;}
function lbNav(d,ev){if(ev)ev.stopPropagation();if(!LB.length)return;LBi=(LBi+d+LB.length)%LB.length;lbShow();}
function lbClose(){document.getElementById("lightbox").style.display="none";}
var ORDEM=["Capítulo","Viagem","Jantar","Almoço","Outro"];
var PLURAL={"Capítulo":"Capítulos","Viagem":"Viagens","Jantar":"Jantares","Almoço":"Almoços","Outro":"Outros"};
var MES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function row(e){
  var d=e.data?new Date(e.data+"T12:00:00"):null;
  var dia=d?("0"+d.getDate()).slice(-2):"--",mes=d?MES[d.getMonth()]:"",ano=d?d.getFullYear():"";
  var loc=[e.local,e.cidade].filter(Boolean).map(esc).join(" · ");
  var badge;if(e.realizado){badge='<span class="evbadge real">Realizado</span>';}else{var txt="Em breve";if(d){var d0=new Date(d.getFullYear(),d.getMonth(),d.getDate()),n=new Date(),n0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),dias=Math.round((d0-n0)/86400000);if(dias===0)txt="hoje";else if(dias===1)txt="amanhã";else if(dias>1)txt="em "+dias+" dias";}badge='<span class="evbadge prox">'+txt+'</span>';}
  var extra="";
  if(e.realizado){
    if(e.relato)extra+='<div class="evrelato">'+esc(e.relato)+'</div>';
    var fotos=(e.evento_fotos||[]).slice().sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});
    if(fotos.length){GAL[e.id]=fotos.map(function(f){return f.url;});extra+='<a class="evfotos" onclick="lbOpen(\''+e.id+'\',0)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.5-2h5L16 6"/></svg> Confira as fotos ('+fotos.length+')</a>';}
  }
  if(e.documento_url){extra+='<a class="evfotos" href="'+esc(e.documento_url)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg> Ver o convite completo</a>';}
  return '<div class="evrow" style="align-items:flex-start;"><div class="evdate"><b>'+dia+'</b><span>'+mes+'</span><small>'+ano+'</small></div>'
    +'<div class="evinfo"><div class="evtitle">'+(e.numero?(esc(e.numero)+" · "):"")+esc(e.titulo||"")+'</div>'
    +'<div class="evmeta">'+esc(e.tipo||"Evento")+(loc?(" · "+loc):"")+'</div>'+extra+'</div>'+badge+'</div>';
}
async function carregar(){
  var u=(await sb.auth.getUser()).data.user;
  document.getElementById("loading").style.display="none";
  if(!u){document.getElementById("needLogin").style.display="block";return;}
  var q=await sb.from("eventos").select("*, evento_fotos(id,url,ordem)").order("data",{ascending:true});
  if(q.error){document.getElementById("needLogin").style.display="block";document.getElementById("needLogin").querySelector("p").textContent="Não foi possível carregar ("+q.error.message+").";return;}
  var rows=q.data||[];
  var hoje=new Date();hoje=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  function fut(e){if(e.realizado)return false;if(!e.data)return true;return new Date(e.data+"T12:00:00")>=hoje;}
  var prox=rows.filter(fut).sort(function(a,b){return (""+(a.data||"")).localeCompare(""+(b.data||""));});
  var ant=rows.filter(function(e){return !fut(e);}).sort(function(a,b){return (""+(b.data||"")).localeCompare(""+(a.data||""));});
  var html='<div class="sec-title">Próximos eventos</div><div class="sec-rule"></div>'+(prox.length?prox.map(row).join(""):'<p class="state" style="margin:2px 0 10px;">Nenhum evento agendado no momento.</p>');
  if(ant.length){html+='<div class="sec-title" style="margin-top:26px;">Eventos anteriores</div><div class="sec-rule"></div>'+ant.map(row).join("");}
  document.getElementById("evWrap").innerHTML=html;
  document.getElementById("content").style.display="block";
}
document.addEventListener("DOMContentLoaded",carregar);
</script>
<div id="lightbox" onclick="if(event.target===this)lbClose()" style="display:none;position:fixed;inset:0;background:rgba(10,8,5,.93);z-index:60;align-items:center;justify-content:center;"><span onclick="lbClose()" style="position:absolute;top:12px;right:20px;color:#fff;font-size:32px;cursor:pointer;line-height:1;">&times;</span><span onclick="lbNav(-1,event)" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:44px;cursor:pointer;padding:10px 16px;user-select:none;">&#8249;</span><img id="lightboxImg" alt="" style="max-width:90%;max-height:90vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6);"><span onclick="lbNav(1,event)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:44px;cursor:pointer;padding:10px 16px;user-select:none;">&#8250;</span><div id="lbCount" style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#e7d8a8;font-size:13px;letter-spacing:1px;"></div></div>

</script><script>
var I18N={en:{ev_brand:"Events",ev_back:"&#8592; Back",ev_nl_h:"Restricted access",ev_nl_p:"Sign in to view events.",ev_nl_btn:"Sign in",ev_loading:"Loading…",ev_k:"Brotherhood",ev_h1:"Events",ev_intro:"Chapters, trips, dinners and lunches of the Commanderie — past and upcoming."},fr:{ev_brand:"Événements",ev_back:"&#8592; Retour",ev_nl_h:"Accès restreint",ev_nl_p:"Connectez-vous pour voir les événements.",ev_nl_btn:"Se connecter",ev_loading:"Chargement…",ev_k:"Confrérie",ev_h1:"Événements",ev_intro:"Chapitres, voyages, dîners et déjeuners de la Commanderie — passés et à venir."}};
var _orig={};
function setLang(l){try{localStorage.setItem("lang",l);}catch(e){}document.documentElement.lang=(l==="pt"?"pt-BR":l);var d=I18N[l];var els=document.querySelectorAll("[data-i18n]");for(var i=0;i<els.length;i++){var k=els[i].getAttribute("data-i18n");if(!(k in _orig))_orig[k]=els[i].innerHTML;els[i].innerHTML=(l==="pt"||!d||d[k]==null)?_orig[k]:d[k];}var sel=document.getElementById("langSel");if(sel){var as=sel.getElementsByTagName("a");for(var j=0;j<as.length;j++){var on=as[j].getAttribute("data-lang")===l;as[j].style.color=on?"#1e2a56":"#9a8f72";as[j].style.fontWeight=on?"bold":"normal";}}}
document.addEventListener("DOMContentLoaded",function(){var sl="pt";try{sl=localStorage.getItem("lang")||"pt";}catch(e){}if(sl!=="pt"&&sl!=="en"&&sl!=="fr")sl="pt";setLang(sl);});
</script>
