<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotos e Vídeos — Commanderie de Bordeaux</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#1e2a56">
<style>
:root{--parch:#f3ecd9;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 2px 16px rgba(40,30,10,.05);}
.dtop img{width:34px;}.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;white-space:nowrap;}
.dhead{text-align:center;padding:34px 20px 4px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:36px;margin:6px 0 2px;}
.dhead p{font-size:14px;color:#8a8270;margin:4px 0 0;}
.wrap{max-width:1100px;margin:0 auto;padding:14px 18px 60px;}
.anos{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 10px;}
.ano{cursor:pointer;border:1.5px solid var(--gold);background:#fffdf7;color:var(--navy);border-radius:20px;padding:6px 16px;font-size:13px;}
.ano.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory;}
.tabs::-webkit-scrollbar{height:6px;}.tabs::-webkit-scrollbar-thumb{background:#d9cba4;border-radius:4px;}
.tab{flex:none;scroll-snap-align:start;cursor:pointer;width:178px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;font-family:inherit;transition:border-color .15s,box-shadow .15s,transform .15s;}
.tab:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(40,30,10,.12);}
.tab.on{border:2px solid var(--navy);box-shadow:0 10px 24px rgba(30,42,86,.18);}
.tab .th{height:92px;background:#efe6cf center/cover no-repeat;display:flex;align-items:flex-end;}
.tab .th span{background:rgba(30,42,86,.85);color:#f3e3bd;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-top-right-radius:8px;}
.tab .tb{padding:9px 11px 10px;}
.tab .td{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:bold;}
.tab .tt{font-family:Georgia,serif;color:var(--navy);font-size:14.5px;line-height:1.25;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tab .tc{font-size:11px;color:#8a8270;margin-top:4px;}
.painel{background:#fffdf7;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:20px 22px;margin-top:8px;box-shadow:0 6px 18px rgba(40,30,10,.06);}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.ph .d{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:bold;}
.ph h2{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:26px;margin:4px 0 2px;}
.ph .l{font-size:13px;color:#8a8270;}
.acts{display:flex;gap:8px;flex-wrap:wrap;}
.b{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;text-decoration:none;}
.b.s{background:var(--navy);color:#fff;}.b.g{background:transparent;color:var(--navy);border:1px solid var(--gold);}.b.go{background:var(--gold);color:#fff;}
.b:disabled{opacity:.6;cursor:default;}
.sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:22px 0 10px;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.ft{position:relative;border-radius:10px;overflow:hidden;background:#efe6cf;aspect-ratio:4/3;cursor:zoom-in;}
.ft img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.ft:hover img{transform:scale(1.04);}
.ft .dl{position:absolute;right:7px;bottom:7px;width:34px;height:34px;border-radius:50%;background:rgba(255,253,247,.94);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);border:none;cursor:pointer;opacity:.95;}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.vd{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.vd .fr{position:relative;aspect-ratio:16/9;background:#111;}
.vd iframe,.vd video{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vd .vl{display:flex;align-items:center;justify-content:center;height:100%;color:#f3e3bd;text-decoration:none;font-size:14px;gap:8px;background:linear-gradient(135deg,#26335f,#161f3f);}
.vd .vt{padding:9px 12px;font-size:13px;color:#5b5446;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.vazio{text-align:center;color:#8a8270;font-size:14px;padding:26px 10px;border:1.5px dashed var(--line);border-radius:12px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.lb{position:fixed;inset:0;background:rgba(10,8,5,.94);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;}
.lb img{max-width:94vw;max-height:80vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;font-size:30px;width:52px;height:52px;border-radius:50%;cursor:pointer;}
.lb .p{left:14px;}.lb .n{right:14px;}
.lb .x{position:absolute;top:14px;right:16px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer;}
.lb .bar{display:flex;gap:10px;align-items:center;margin-top:14px;color:#ddd;font-size:13px;}
.modal{position:fixed;inset:0;background:rgba(20,29,56,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:16px;}
.box{background:#fffdf7;border-radius:14px;max-width:480px;width:100%;padding:20px 22px;}
.box h3{font-family:Georgia,serif;color:var(--navy);font-weight:normal;margin:0 0 10px;font-size:20px;}
.box label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;margin:10px 0 4px;}
.box input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;}
.hint{font-size:12px;color:#8a8270;margin-top:8px;line-height:1.5;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2f6b3a;color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:90;max-width:92vw;text-align:center;}
@media(max-width:600px){.dhead h1{font-size:28px;}.grid{grid-template-columns:repeat(2,1fr);}.painel{padding:16px 14px;}.vids{grid-template-columns:1fr;}}
</style></head><body>
<div class="dtop"><a href="index.html?painel=1" style="display:inline-flex;align-items:center;" title="Painel do Comendador"><img src="img/brasao.png" alt="Brasão"></a><b>Fotos e Vídeos</b><a class="back" href="index.html?painel=1">&#8592; Voltar ao Painel</a></div>
<div id="needLogin" class="state" style="display:none;"><h2>Acesso restrito</h2><p>Entre na sua conta para ver as fotos e os vídeos.</p><a class="b s" href="index.html?login=1">Entrar</a></div>
<div id="loading" class="state">Carregando…</div>
<div id="app" style="display:none;">
  <div class="dhead"><div class="k">Painel do Comendador</div><h1>Fotos e Vídeos</h1><p>Capítulos, jantares e encontros da Commanderie — veja, baixe e compartilhe.</p></div>
  <div class="wrap">
    <div class="anos" id="anos"></div>
    <div class="tabs" id="tabs"></div>
    <div class="painel" id="painel"></div>
  </div>
</div>
<div class="lb" id="lb" onclick="if(event.target===this)fecharLb()"><button class="x" onclick="fecharLb()">&times;</button><button class="nv p" onclick="mover(-1)">&#8249;</button><img id="lbImg" alt=""><button class="nv n" onclick="mover(1)">&#8250;</button><div class="bar"><span id="lbC"></span><button class="b go" onclick="baixarAtual()">&#11015; Baixar esta foto</button></div></div>
<div class="modal" id="mV"><div class="box">
  <h3>Adicionar vídeo</h3>
  <label>Link do vídeo (YouTube, Instagram, Google Drive…)</label><input id="vLink" placeholder="https://youtu.be/…">
  <label>ou enviar o arquivo do vídeo (MP4, até 50 MB)</label><input id="vArq" type="file" accept="video/*">
  <label>Título (opcional)</label><input id="vTit" placeholder="Ex.: Brinde de abertura">
  <div class="hint" id="vMsg"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;"><button class="b g" onclick="document.getElementById('mV').style.display='none'">Cancelar</button><button class="b s" id="vBtn" onclick="salvarVideo()">Enviar</button></div>
</div></div>
<input type="file" id="fArq" accept="image/*" multiple style="display:none" onchange="enviarFotos(this.files);this.value=''">
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var sb=window.supabase.createClient("https://yvdkaycwtulqjnvlpgvy.supabase.co","sb_publishable_v3QZOo0NYLpOAk9p5JBNjQ_r0vb-Zjd");
var U=null,CONS=false,EVS=[],ANO=null,CUR=null,LBI=0;
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(t,ms){var e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(function(){e.style.opacity=0;},ms||4200);}
function fdat(d,longo){if(!d)return "";var x=new Date(d+"T12:00:00");return longo?x.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):x.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function nomeEv(e){var t=e.titulo||"";if(e.numero&&e.tipo&&t.indexOf(e.numero)<0)return e.tipo+" "+e.numero+(t?(" · "+t):"");return t||((e.tipo||"Evento")+(e.numero?(" "+e.numero):""));}
async function init(){
  U=(await sb.auth.getUser()).data.user;document.getElementById("loading").style.display="none";
  if(!U){document.getElementById("needLogin").style.display="block";return;}
  try{var c=await sb.rpc("is_conselho");CONS=!!(c&&c.data);}catch(e){}
  var hoje=new Date().toISOString().slice(0,10);
  var q=await sb.from("eventos").select("id,tipo,numero,titulo,data,local,realizado,evento_fotos(id,url,ordem),evento_videos(id,url,titulo,path,created_at)").order("data",{ascending:false});
  if(q.error&&/evento_videos/.test(q.error.message||""))q=await sb.from("eventos").select("id,tipo,numero,titulo,data,local,realizado,evento_fotos(id,url,ordem)").order("data",{ascending:false});
  if(q.error){document.getElementById("needLogin").style.display="block";document.querySelector("#needLogin p").textContent="Não foi possível carregar ("+q.error.message+").";return;}
  EVS=(q.data||[]).filter(function(e){return e.realizado||(e.data&&e.data<=hoje);}).map(function(e){e.k="ev";e.fotos=(e.evento_fotos||[]).slice().sort(function(a,b){return (a.ordem||0)-(b.ordem||0);}).map(function(f){return f.url;});e.videos=(e.evento_videos||[]).slice().sort(function(a,b){return (""+a.created_at).localeCompare(""+b.created_at);});return e;});
  try{var ri=await sb.rpc("eventos_institucionais_membros");(ri.data||[]).forEach(function(x){if((x.fotos||[]).length)EVS.push({k:"inst",id:"i_"+x.id,titulo:x.titulo,data:x.data,local:x.local,tipo:"Institucional",fotos:x.fotos,videos:[]});});}catch(e){}
  EVS.sort(function(a,b){return (""+(b.data||"")).localeCompare(""+(a.data||""));});
  document.getElementById("app").style.display="block";
  var anos=[];EVS.forEach(function(e){var a=(e.data||"").slice(0,4);if(a&&anos.indexOf(a)<0)anos.push(a);});
  var qs=new URLSearchParams(location.search),ev=qs.get("evento");
  var alvo=ev?EVS.find(function(e){return e.id===ev;}):(EVS.find(function(e){return e.fotos.length||e.videos.length;})||EVS[0]);
  ANO=alvo?(alvo.data||"").slice(0,4):anos[0];
  document.getElementById("anos").innerHTML=(anos.length>1?anos.map(function(a){return "<span class='ano"+(a===ANO?" on":"")+"' onclick='setAno(\""+a+"\")'>"+a+"</span>";}).join(""):"");
  renderTabs();if(alvo)abrir(alvo.id);else document.getElementById("painel").innerHTML="<div class='vazio'>Ainda não há eventos realizados.</div>";}
function setAno(a){ANO=a;document.querySelectorAll(".ano").forEach(function(x){x.classList.toggle("on",x.textContent===a);});renderTabs();var f=EVS.find(function(e){return (e.data||"").slice(0,4)===a;});if(f)abrir(f.id);}
function renderTabs(){var L=EVS.filter(function(e){return !ANO||(e.data||"").slice(0,4)===ANO;});
  document.getElementById("tabs").innerHTML=L.map(function(e){var cap=e.fotos[0]||"img/brasao-alta.png";var n=e.fotos.length,v=e.videos.length;
    return "<button class='tab"+(CUR&&CUR.id===e.id?" on":"")+"' id='t_"+e.id+"' onclick='abrir(\""+e.id+"\")'><div class='th' style=\"background-image:url('"+esc(cap)+"');"+(e.fotos[0]?"":"background-size:46%;")+"\"><span>"+esc(e.k==="inst"?"Institucional":(e.tipo||"Evento"))+"</span></div><div class='tb'><div class='td'>"+fdat(e.data)+"</div><div class='tt'>"+esc(nomeEv(e))+"</div><div class='tc'>"+n+" foto"+(n===1?"":"s")+(v?(" · "+v+" vídeo"+(v===1?"":"s")):"")+"</div></div></button>";}).join("");}
function ytId(u){var m=(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m?m[1]:null;}
function videoHtml(v){var y=ytId(v.url),inner;
  if(y)inner="<iframe src='https://www.youtube-nocookie.com/embed/"+y+"' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen loading='lazy'></iframe>";
  else if(/\.(mp4|mov|webm|m4v)(\?|$)/i.test(v.url)||v.path)inner="<video src='"+esc(v.url)+"' controls preload='metadata' playsinline></video>";
  else inner="<a class='vl' href='"+esc(v.url)+"' target='_blank' rel='noopener'>&#9654; Assistir ao vídeo</a>";
  var baixa=(!y&&(v.path||/\.(mp4|mov|webm|m4v)(\?|$)/i.test(v.url)))?("<a class='b g' style='padding:6px 10px;font-size:12px;' onclick='baixar(\""+esc(v.url)+"\",\"video-"+(v.id||"")+".mp4\")'>&#11015; Baixar</a>"):("<a href='"+esc(v.url)+"' target='_blank' rel='noopener' style='color:var(--navy);font-size:12px;'>abrir ›</a>");
  return "<div class='vd'><div class='fr'>"+inner+"</div><div class='vt'><span>"+esc(v.titulo||"Vídeo")+"</span>"+baixa+"</div></div>";}
function abrir(id){CUR=EVS.find(function(e){return e.id===id;});if(!CUR)return;document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.id==="t_"+id);});var t=document.getElementById("t_"+id);if(t)t.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  var e=CUR,pode=e.k==="ev";
  var h="<div class='ph'><div><div class='d'>"+esc(fdat(e.data,true))+"</div><h2>"+esc(nomeEv(e))+"</h2>"+(e.local?("<div class='l'>"+esc(e.local)+"</div>"):"")+"</div><div class='acts'>"
    +(e.fotos.length?("<button class='b go' id='bZip' onclick='baixarTodas()'>&#11015; Baixar todas as fotos ("+e.fotos.length+")</button>"):"")
    +(pode?"<button class='b s' onclick='document.getElementById(\"fArq\").click()'>+ Enviar fotos</button><button class='b g' onclick='abrirVideo()'>+ Vídeo</button>":"")+"</div></div>";
  if(e.videos.length)h+="<div class='sub'>Vídeos ("+e.videos.length+")</div><div class='vids'>"+e.videos.map(videoHtml).join("")+"</div>";
  h+="<div class='sub'>Fotos ("+e.fotos.length+")</div>"+(e.fotos.length?("<div class='grid'>"+e.fotos.map(function(u,i){return "<div class='ft' onclick='abrirLb("+i+")'><img src='"+esc(u)+"' loading='lazy' alt=''><button class='dl' title='Baixar' onclick='event.stopPropagation();baixar(\""+esc(u)+"\",nomeArq("+i+"))'><svg viewBox='0 0 24 24' width='17' height='17' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M12 4v11M7 10l5 5 5-5M5 20h14'/></svg></button></div>";}).join("")+"</div>"):"<div class='vazio'>Ainda não há fotos deste evento."+(pode?" Seja o primeiro a enviar! Clique em <b>+ Enviar fotos</b>.":"")+"</div>");
  if(pode)h+="<div class='hint' style='margin-top:14px;'>"+(CONS?"Como Conselho, as fotos e vídeos que você enviar entram na hora.":"As fotos e vídeos que você enviar aparecem aqui depois que o Conselho aprovar.")+"</div>";
  document.getElementById("painel").innerHTML=h;
  try{var u=new URL(location.href);u.searchParams.set("evento",id);history.replaceState(null,"",u);}catch(x){}}
function slug(s){return (s||"evento").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);}
function nomeArq(i){return slug((CUR.data||"")+"-"+nomeEv(CUR))+"-"+String(i+1).padStart(3,"0")+".jpg";}
async function baixar(url,nome){try{var r=await fetch(url,{mode:"cors"});if(!r.ok)throw 0;var b=await r.blob();var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nome||"foto.jpg";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);}catch(e){window.open(url,"_blank");toast("A foto abriu em outra aba — toque e segure (ou clique com o botão direito) para salvar.");}}
async function baixarTodas(){var e=CUR;if(!e||!e.fotos.length)return;var b=document.getElementById("bZip");if(!window.JSZip){toast("Baixando uma a uma…");for(var i=0;i<e.fotos.length;i++){await baixar(e.fotos[i],nomeArq(i));}return;}
  b.disabled=true;var zip=new JSZip(),ok=0;for(var i=0;i<e.fotos.length;i++){b.textContent="Preparando "+(i+1)+" de "+e.fotos.length+"…";try{var r=await fetch(e.fotos[i],{mode:"cors"});if(r.ok){zip.file(nomeArq(i),await r.blob());ok++;}}catch(x){}}
  b.textContent="Compactando…";var blob=await zip.generateAsync({type:"blob"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=slug((e.data||"")+"-"+nomeEv(e))+".zip";document.body.appendChild(a);a.click();a.remove();
  b.disabled=false;b.innerHTML="&#11015; Baixar todas as fotos ("+e.fotos.length+")";toast("✔ "+ok+" fotos baixadas num arquivo .zip");}
function abrirLb(i){LBI=i;mostrarLb();document.getElementById("lb").style.display="flex";}
function mostrarLb(){var f=CUR.fotos;document.getElementById("lbImg").src=f[LBI];document.getElementById("lbC").textContent=(LBI+1)+" de "+f.length;}
function mover(d){var n=CUR.fotos.length;LBI=(LBI+d+n)%n;mostrarLb();}
function fecharLb(){document.getElementById("lb").style.display="none";}
function baixarAtual(){baixar(CUR.fotos[LBI],nomeArq(LBI));}
document.addEventListener("keydown",function(e){if(document.getElementById("lb").style.display!=="flex")return;if(e.key==="ArrowRight")mover(1);else if(e.key==="ArrowLeft")mover(-1);else if(e.key==="Escape")fecharLb();});
// ---------- enviar ----------
function comprimeFoto(f,max,q){return new Promise(function(res){var img=new Image();img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){res(b||f);},"image/jpeg",q);};img.onerror=function(){res(f);};img.src=URL.createObjectURL(f);});}
async function proposta(rec){var ins=await sb.from("evento_fotos_propostas").insert(rec).select("id").single();if(ins.error)throw ins.error;if(CONS){var r=await sb.rpc("foto_proposta_decidir",{p_id:ins.data.id,p_aprovar:true});if(r.error)throw r.error;}}
async function enviarFotos(files){if(!files||!files.length||!CUR)return;var ev=CUR.id,ok=0,err="";for(var i=0;i<files.length;i++){toast("Enviando "+(i+1)+" de "+files.length+"…",60000);try{var blob=await comprimeFoto(files[i],2000,0.86);var path="propostas/"+ev+"/"+U.id+"/"+Date.now()+"_"+i+".jpg";var up=await sb.storage.from("eventos").upload(path,blob,{contentType:"image/jpeg",upsert:false});if(up.error)throw up.error;var url=sb.storage.from("eventos").getPublicUrl(path).data.publicUrl;await proposta({evento_id:ev,url:url,path:path});ok++;if(CONS)CUR.fotos.push(url);}catch(e){err=e.message||String(e);}}
  toast(ok?(CONS?("✔ "+ok+" foto(s) adicionada(s)."):("✔ Obrigado! "+ok+" foto(s) enviada(s) — aparecem depois que o Conselho aprovar.")):("Não foi possível enviar: "+err),6000);if(CONS&&ok){abrir(ev);renderTabs();}}
function abrirVideo(){["vLink","vTit"].forEach(function(k){document.getElementById(k).value="";});document.getElementById("vArq").value="";document.getElementById("vMsg").textContent="";document.getElementById("mV").style.display="flex";}
async function salvarVideo(){var m=document.getElementById("vMsg"),b=document.getElementById("vBtn");var link=document.getElementById("vLink").value.trim(),f=document.getElementById("vArq").files[0],tit=document.getElementById("vTit").value.trim()||null;var ev=CUR.id;
  if(!link&&!f){m.style.color="#8f1d24";m.textContent="Cole o link ou escolha o arquivo do vídeo.";return;}
  b.disabled=true;try{var rec={evento_id:ev,tipo:"video",legenda:tit};
    if(f){if(f.size>50*1024*1024){throw new Error("o arquivo passa de 50 MB — envie pelo YouTube ou Google Drive e cole o link");}m.style.color="#5b5446";m.textContent="Enviando o vídeo… (pode levar alguns minutos)";var ext=(f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"");var path="propostas/"+ev+"/"+U.id+"/"+Date.now()+"."+ext;var up=await sb.storage.from("eventos").upload(path,f,{contentType:f.type||"video/mp4",upsert:false});if(up.error)throw up.error;rec.url=sb.storage.from("eventos").getPublicUrl(path).data.publicUrl;rec.path=path;}
    else{if(!/^https?:\/\//.test(link))link="https://"+link;rec.url=link;}
    await proposta(rec);document.getElementById("mV").style.display="none";
    if(CONS){CUR.videos.push({url:rec.url,titulo:tit,path:rec.path});abrir(ev);renderTabs();toast("✔ Vídeo adicionado.");}else toast("✔ Obrigado! O vídeo aparece aqui depois que o Conselho aprovar.",6000);
  }catch(e){m.style.color="#8f1d24";m.textContent="Não foi possível enviar: "+(e.message||e);}b.disabled=false;}
init();
</script>
</body></html>
