<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique — Commanderie de Bordeaux</title><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png?v=3"><link rel="apple-touch-icon" href="img/icon-180.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#1e2a56"><meta name="apple-mobile-web-app-title" content="Commanderie">
<style>
:root{--parch:#f3ecd9;--parch2:#ece3cd;--cream:#f8f3e6;--navy:#1e2a56;--gold:#b08a3a;--gold-l:#c9a85c;--red:#8f1d24;--ink:#2a2620;--line:#ddd0ad;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.dtop{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 2px 16px rgba(40,30,10,.05);}
.dtop img{width:34px;}
.dtop b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.dtop .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#fffdf7;border:1px solid var(--gold);border-radius:20px;padding:7px 15px;text-decoration:none;cursor:pointer;transition:all .15s ease;}.dtop .back:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.dhead{text-align:center;padding:34px 20px 6px;}
.dhead .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
.dhead h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:36px;margin:6px 0 2px;}
.dhead p{max-width:520px;margin:6px auto 0;color:#5b5446;line-height:1.55;font-size:14px;}
.wrap{max-width:960px;margin:0 auto;padding:14px 20px 60px;}
.sec-title{font-family:Georgia,serif;color:var(--navy);font-size:22px;font-weight:normal;margin:28px 0 4px;}
.sec-rule{height:1px;background:var(--line);margin:0 0 16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.prod{background:#fffdf7;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 15px rgba(40,30,10,.05);display:flex;flex-direction:column;}
.prod .ph{aspect-ratio:4/3;background:linear-gradient(160deg,#243161,#161f3f);display:flex;align-items:center;justify-content:center;}
.prod .ph img{width:100%;height:100%;object-fit:cover;}
.prod .ph span{color:var(--gold-l);font-family:Georgia,serif;font-size:34px;}
.prod .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;}
.prod h3{font-family:Georgia,serif;color:var(--navy);font-weight:normal;font-size:17px;margin:0 0 4px;}
.prod p{font-size:12.5px;color:#7a7165;line-height:1.5;flex:1;}
.prod .pr{font-family:Georgia,serif;color:var(--red);font-size:18px;margin:8px 0 10px;}
.prod .pr small{color:#9a937f;font-family:Arial,sans-serif;font-size:12px;}
.prod button{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px;font-size:13.5px;cursor:pointer;width:100%;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#8a8270;border-bottom:1px solid var(--line);padding:6px 8px;}
.tbl td{border-bottom:1px solid #ece0c2;padding:8px;color:#2a2620;}
.pill{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 10px;color:#8a6a1f;background:#f6efdc;border:1px solid var(--line);}
.note{font-size:12.5px;color:#8a6a1f;background:#f6efdc;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:14px;}
.state{text-align:center;padding:70px 20px;color:#6a634f;}
.state h2{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;text-decoration:none;border-radius:11px;padding:11px 22px;font-size:15px;}
</style></head><body>
<div class="dtop"><a href="index.html" style="display:inline-flex;align-items:center;" title="Painel do Comendador"><img src="img/brasao.png" alt="Brasão"></a><b>Boutique</b><a class="back" href="index.html" data-i18n="lj_back">&#8592; Voltar</a><span class="lang-sel" id="langSel" style="display:inline-flex;gap:2px;margin-left:8px;font-size:11.5px;letter-spacing:.5px;"><a data-lang="pt" onclick="setLang('pt')" style="cursor:pointer;padding:2px 5px;">PT</a><a data-lang="en" onclick="setLang('en')" style="cursor:pointer;padding:2px 5px;">EN</a><a data-lang="fr" onclick="setLang('fr')" style="cursor:pointer;padding:2px 5px;">FR</a></span></div>
<div id="needLogin" class="state" style="display:none;"><h2 data-i18n="lj_nl_h">Acesso restrito</h2><p data-i18n="lj_nl_p">Entre na sua conta para acessar a Boutique.</p><a class="btn" href="index.html" data-i18n="lj_nl_btn">Entrar</a></div>
<div id="loading" class="state" data-i18n="lj_loading">Carregando…</div>
<div id="content" style="display:none;">
  <div class="dhead"><div class="k">Commanderie de Bordeaux</div><h1>Boutique</h1><p data-i18n="lj_intro">Produtos oficiais com a marca da Commanderie. Encomende e pague por PIX — o Conselho confirma e organiza a entrega.</p></div>
  <div class="wrap">
    <div id="catalogo"></div>
    <div class="sec-title" data-i18n="lj_meus">Meus pedidos</div><div class="sec-rule"></div>
    <div id="meusPedidos"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://saotncritqxuchsvvnzi.supabase.co","sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5");
var ORDEM=["Cristais","Vestuário","Acessórios","Impressos","Decoração","Outros"];
var MEMBRO=null;
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function brl(v){return "R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function inic(n){var p=(""+(n||"")).trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase()||"·";}
async function init(){
  var u=(await sb.auth.getUser()).data.user;
  document.getElementById("loading").style.display="none";
  if(!u){document.getElementById("needLogin").style.display="block";return;}
  var mb=await sb.from("membros").select("nome").eq("user_id",u.id).maybeSingle();
  MEMBRO=(mb.data&&mb.data.nome)||"Comendador";
  document.getElementById("content").style.display="block";
  await carregar();await meusPedidos();
}
async function carregar(){
  var el=document.getElementById("catalogo");
  var q=await sb.from("loja_produtos").select("*").eq("ativo",true).order("ordem",{ascending:true}).order("nome",{ascending:true});
  if(q.error){el.innerHTML="<p style=\"color:#9a937f;font-size:13px;\">(rode o SQL da loja) "+esc(q.error.message)+"</p>";return;}
  var rows=q.data||[];
  if(!rows.length){el.innerHTML="<p style=\"color:#8a8270;font-size:14px;text-align:center;padding:30px;\">Em breve, produtos oficiais da Commanderie.</p>";return;}
  var grupos={};rows.forEach(function(p){var c=p.categoria||"Outros";(grupos[c]=grupos[c]||[]).push(p);});
  var cats=Object.keys(grupos).sort(function(a,b){var ia=ORDEM.indexOf(a),ib=ORDEM.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);});
  el.innerHTML=cats.map(function(c){
    return "<div class=\"sec-title\">"+esc(c)+"</div><div class=\"sec-rule\"></div><div class=\"grid\">"+grupos[c].map(card).join("")+"</div>";
  }).join("");
}
function card(p){
  var ph=p.foto_url?("<img src=\""+esc(p.foto_url)+"\" loading=\"lazy\" alt=\""+esc(p.nome)+"\">"):("<span>"+inic(p.nome)+"</span>");
  var pr=(p.preco!=null&&Number(p.preco)>0)?brl(p.preco):"<small>Sob consulta</small>";
  return "<div class=\"prod\"><div class=\"ph\">"+ph+"</div><div class=\"bd\"><h3>"+esc(p.nome)+"</h3><p>"+esc(p.descricao||"")+"</p><div class=\"pr\">"+pr+"</div><button onclick=\"encomendar('"+p.id+"')\">Encomendar</button></div></div>";
}
window.PRODS={};
async function encomendar(id){
  var q=await sb.from("loja_produtos").select("*").eq("id",id).maybeSingle();
  if(q.error||!q.data){alert("Produto indisponível.");return;}
  var p=q.data;
  var qs=prompt("Quantas unidades de \""+p.nome+"\"?","1");if(qs===null)return;var qtd=parseInt(qs,10);if(!qtd||qtd<1)qtd=1;
  var obs=prompt("Alguma observação? (opcional)","")||null;
  var r=await sb.from("loja_pedidos").insert({produto_id:p.id,produto_nome:p.nome,preco:p.preco,qtd:qtd,nome:MEMBRO,obs:obs,status:"Novo"});
  if(r.error){alert("Erro: "+r.error.message);return;}
  alert("Pedido registrado! ✔\n\nO Conselho vai confirmar o valor e a entrega. Para adiantar, pague por PIX em Pagamentos e envie o comprovante à Secretaria.");
  meusPedidos();
}
async function meusPedidos(){
  var el=document.getElementById("meusPedidos");
  var q=await sb.from("loja_pedidos").select("*").order("created_at",{ascending:false});
  if(q.error){el.innerHTML="<p style=\"color:#9a937f;font-size:13px;\">Não foi possível carregar.</p>";return;}
  var rows=(q.data||[]);
  if(!rows.length){el.innerHTML="<p style=\"color:#8a8270;font-size:13px;\">Você ainda não fez nenhum pedido.</p>";return;}
  var tb="<table class=\"tbl\"><thead><tr><th>Produto</th><th>Qtd</th><th>Valor</th><th>Status</th></tr></thead><tbody>";
  rows.forEach(function(x){var v=(x.preco!=null&&Number(x.preco)>0)?brl(Number(x.preco)*(x.qtd||1)):"—";tb+="<tr><td>"+esc(x.produto_nome)+"</td><td>"+esc(x.qtd||1)+"</td><td>"+v+"</td><td><span class=\"pill\">"+esc(x.status)+"</span></td></tr>";});
  el.innerHTML=tb+"</tbody></table><div class=\"note\">Pagamento por PIX (em <a href=\"pagamentos.html\" style=\"color:#1e2a56;\">Pagamentos</a>) — envie o comprovante à Secretaria. Cartão e recorrência entram quando a conta da associação estiver ativa.</div>";
}
document.addEventListener("DOMContentLoaded",init);
</script><script>
var I18N={en:{lj_back:"&#8592; Back",lj_nl_h:"Restricted access",lj_nl_p:"Sign in to access the Boutique.",lj_nl_btn:"Sign in",lj_loading:"Loading…",lj_intro:"Official products bearing the Commanderie’s mark. Order and pay by PIX — the Council confirms and arranges delivery.",lj_meus:"My orders"},fr:{lj_back:"&#8592; Retour",lj_nl_h:"Accès restreint",lj_nl_p:"Connectez-vous pour accéder à la Boutique.",lj_nl_btn:"Se connecter",lj_loading:"Chargement…",lj_intro:"Produits officiels à la marque de la Commanderie. Commandez et payez par PIX — le Conseil confirme et organise la livraison.",lj_meus:"Mes commandes"}};
var _orig={};
function setLang(l){try{localStorage.setItem("lang",l);}catch(e){}document.documentElement.lang=(l==="pt"?"pt-BR":l);var d=I18N[l];var els=document.querySelectorAll("[data-i18n]");for(var i=0;i<els.length;i++){var k=els[i].getAttribute("data-i18n");if(!k)continue;if(!(k in _orig))_orig[k]=els[i].innerHTML;els[i].innerHTML=(l==="pt"||!d||d[k]==null)?_orig[k]:d[k];}var sel=document.getElementById("langSel");if(sel){var as=sel.getElementsByTagName("a");for(var j=0;j<as.length;j++){var on=as[j].getAttribute("data-lang")===l;as[j].style.color=on?"#1e2a56":"#9a8f72";as[j].style.fontWeight=on?"bold":"normal";}}}
document.addEventListener("DOMContentLoaded",function(){var sl="pt";try{sl=localStorage.getItem("lang")||"pt";}catch(e){}if(sl!=="pt"&&sl!=="en"&&sl!=="fr")sl="pt";setLang(sl);});
</script>
</body></html>
