<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textos da Entronização — Commanderie de Bordeaux Brasil</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3"><meta name="theme-color" content="#1e2a56">
<style>
:root{--navy:#1e2a56;--gold:#b08a3a;--cream:#f8f3e6;--line:#ddd0ad;--ink:#2a2620;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.bar img{width:32px;}
.bar b{font-family:Georgia,serif;color:var(--navy);font-weight:normal;}
.bar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;max-width:100%;}
.btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;text-decoration:none;}
.ghost{background:transparent;color:var(--navy);border:1px solid var(--gold);}
.back{margin-left:auto;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);border:1px solid var(--gold);border-radius:20px;padding:7px 14px;text-decoration:none;}
.dica{max-width:820px;margin:14px auto 0;padding:0 16px;font-size:12.5px;color:#8a8270;line-height:1.55;}
.doc{max-width:820px;margin:16px auto 50px;padding:0 16px;}
.capa{background:#fffdf7;border:1px solid var(--line);border-radius:16px;padding:34px 30px;text-align:center;margin-bottom:18px;}
.capa img{width:96px;}
.capa .k{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-top:12px;}
.capa h1{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:30px;margin:8px 0 4px;}
.capa .s{color:#6a634f;font-size:14px;}
.pess{background:#fffdf7;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:22px 26px;margin-bottom:16px;page-break-inside:avoid;}
.pess .n{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.pess h2{font-family:Georgia,serif;font-weight:normal;color:var(--navy);font-size:24px;margin:4px 0 10px;}
.pess .t{font-family:Georgia,serif;font-size:16.5px;line-height:1.75;color:#2a2620;outline:none;border-radius:8px;padding:4px 6px;margin:0 -6px;}
.pess .t:focus{background:#fbf6e9;box-shadow:0 0 0 1px #e6d6a8;}
.pess .t p{margin:0 0 10px;}
.pess .fala{font-style:italic;color:var(--navy);}
.falta{font-size:12px;color:#b0402f;margin-top:8px;}
.lema{text-align:center;font-family:Georgia,serif;font-style:italic;color:var(--gold);margin:22px 0;}
.state{text-align:center;padding:60px 20px;color:#6a634f;}
@media print{.bar,.dica,.noprint{display:none!important;}body{background:#fff;}.doc{margin:0 auto;}.pess,.capa{border-color:#ccc;}.pess .t:focus{background:none;box-shadow:none;}}
</style></head><body>
<div class="bar"><a href="painel-conselho.html?sec=indicacoes"><img src="img/brasao.png" alt=""></a><b>Textos da Entronização</b>
<select id="cap" onchange="trocar()"></select>
<button class="btn" onclick="window.print()">&#128424; Imprimir / PDF</button>
<button class="btn ghost" onclick="copiarTudo()">&#128203; Copiar texto</button>
<a class="back" href="painel-conselho.html?sec=indicacoes">&#8592; Voltar</a></div>
<div class="dica">A carta é montada com a ficha de entronização que cada indicado preencheu: biografia, profissão, ligação com Bordeaux, vinhos e padrinhos. <b>Clique em qualquer texto para ajustar</b> antes de imprimir. Os ajustes não ficam salvos: imprima ou copie no fim.</div>
<div class="doc" id="doc"><div class="state">Carregando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient("https://yvdkaycwtulqjnvlpgvy.supabase.co","sb_publishable_v3QZOo0NYLpOAk9p5JBNjQ_r0vb-Zjd");
var CAPS=[],MEMB=[];
function esc(s){return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function limpa(t){return (""+(t||"")).trim().replace(/\s+\./g,".");}
function ponto(t){t=limpa(t);if(!t)return "";return /[.!?…]$/.test(t)?t:(t+".");}
function capNome(c){var a=(c.tipo||"Capítulo")+(c.numero?(" "+c.numero):"");var t=(c.titulo||"").trim();return t&&t.toLowerCase()!==a.toLowerCase()?(a+" · "+t):a;}
function fData(d){return d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"}):"";}
function fem(f){return /^(sra|dra|profa|prof\.?a|senhora|doutora)/i.test((f.tratamento||"").trim());}
function nomeDe(m){var f=m.ficha||{};var n=limpa((f.nome||"")+" "+(f.sobrenome||""));return n||m.nome||"";}
function texto(m){var f=m.ficha||{},F=fem(f),nome=nomeDe(m),pn=nome.split(" ")[0];var P=[],falta=[];
  var abre=(f.tratamento?(limpa(f.tratamento)+" "):"")+nome;
  var quem=[];if(f.profissao){var pr=limpa(f.profissao);quem.push(/^[A-ZÀ-Ý][a-zà-ÿ]/.test(pr)&&!/^[A-Z]{2}/.test(pr)?pr.charAt(0).toLowerCase()+pr.slice(1):pr);}if(f.cidade)quem.push((F?"radicada em ":"radicado em ")+limpa(f.cidade));if(f.nacionalidade&&!/brasil/i.test(f.nacionalidade))quem.push("de nacionalidade "+limpa(f.nacionalidade).toLowerCase());
  P.push("Apresentamos "+abre+(quem.length?(", "+quem.join(", ")):"")+".");
  if(f.biografia)P.push(ponto(f.biografia));else falta.push("biografia");
  if(f.atividades)P.push(ponto(f.atividades));
  if(f.honrarias)P.push("Entre as suas distinções: "+ponto(f.honrarias).replace(/^./,function(c){return c.toLowerCase();}));
  if(f.ligacao_bordeaux)P.push("A sua ligação com Bordeaux: "+ponto(f.ligacao_bordeaux).replace(/^./,function(c){return c.toLowerCase();}));else falta.push("ligação com Bordeaux");
  var v=[];if(f.primeiro_bordeaux)v.push("o primeiro Bordeaux que marcou a sua história foi "+limpa(f.primeiro_bordeaux).replace(/\.$/,""));if(f.bordeaux_preferido)v.push((v.length?"e ":"")+"o seu Bordeaux preferido é "+limpa(f.bordeaux_preferido).replace(/\.$/,""));
  if(v.length){var s=v.join(", ");P.push(s.charAt(0).toUpperCase()+s.slice(1)+".");}
  if(f.experiencia)P.push("Uma experiência memorável: "+ponto(f.experiencia).replace(/^./,function(c){return c.toLowerCase();}));
  var pad=[f.padrinho1,f.padrinho2].map(limpa).filter(Boolean);if(pad.length)P.push((F?"Apadrinhada":"Apadrinhado")+" por "+pad.join(" e ")+".");
  P.push('<span class="fala">'+esc(pn)+', pelos poderes que nos são conferidos, '+(F?"nós a recebemos":"nós o recebemos")+' como '+(F?"Comendadora":"Comendador")+' da Commanderie de Bordeaux do Brasil. Bordeaux, toujours Bordeaux!</span>');
  return {nome:nome,html:P.map(function(p){return "<p>"+(p.indexOf('<span class="fala">')===0?p:esc(p))+"</p>";}).join(""),falta:falta,temFicha:!!m.ficha};}
async function init(){
  var u=(await sb.auth.getUser()).data.user;if(!u){document.getElementById("doc").innerHTML='<div class="state">Entre na sua conta do Conselho. <a href="index.html?login=1">Entrar</a></div>';return;}
  var q=await sb.from("eventos").select("id,tipo,numero,titulo,data,local,cidade,nucleo").ilike("tipo","cap%").order("data",{ascending:false});
  CAPS=(q.data||[]).filter(function(e){return e.data;});
  var mq=await sb.from("membros").select("id,nome,email,nucleo,grau,eleito,data_intronizacao,ficha,foto_url").not("data_intronizacao","is",null);
  if(mq.error){document.getElementById("doc").innerHTML='<div class="state">Sem acesso: '+esc(mq.error.message)+'</div>';return;}
  MEMB=mq.data||[];
  var cont={};MEMB.forEach(function(m){cont[m.data_intronizacao]=(cont[m.data_intronizacao]||0)+1;});
  CAPS=CAPS.filter(function(c){return cont[c.data];});
  var sel=document.getElementById("cap");
  if(!CAPS.length){sel.innerHTML="<option>Nenhum capítulo com indicados</option>";document.getElementById("doc").innerHTML='<div class="state">Ainda não há indicados aprovados com capítulo de entronização marcado.</div>';return;}
  sel.innerHTML=CAPS.map(function(c){return '<option value="'+c.id+'">'+esc(capNome(c)+" · "+new Date(c.data+"T12:00:00").toLocaleDateString("pt-BR")+" ("+cont[c.data]+")")+'</option>';}).join("");
  var pre=new URLSearchParams(location.search).get("ev");var hoje=new Date().toISOString().slice(0,10);
  var alvo=CAPS.find(function(c){return c.id===pre;})||CAPS.slice().reverse().find(function(c){return c.data>=hoje;})||CAPS[0];
  sel.value=alvo.id;trocar();}
function trocar(){var c=CAPS.find(function(x){return x.id===document.getElementById("cap").value;});if(!c)return;
  var L=MEMB.filter(function(m){return m.data_intronizacao===c.data;}).sort(function(a,b){return nomeDe(a).localeCompare(nomeDe(b),"pt");});
  var h='<div class="capa"><img src="img/brasao.png" alt=""><div class="k">Commanderie de Bordeaux do Brasil</div><h1>Cerimônia de Entronização</h1><div class="s">'+esc(capNome(c))+'<br>'+esc(fData(c.data))+(c.local?(" · "+esc(c.local)):"")+(c.cidade?(" · "+esc(c.cidade)):"")+'</div><div class="s" style="margin-top:10px;">'+L.length+' '+(L.length>1?"novos Comendadores":"novo Comendador")+'</div></div>';
  L.forEach(function(m,i){var t=texto(m);h+='<div class="pess"><div class="n">'+(i+1)+' de '+L.length+(m.nucleo?(" · Núcleo "+esc(m.nucleo)):"")+'</div><h2>'+esc(t.nome)+'</h2><div class="t" contenteditable="true">'+t.html+'</div>'+(!t.temFicha?'<div class="falta noprint">&#9888; Ficha de entronização ainda não preenchida — o texto ficou curto.</div>':(t.falta.length?'<div class="falta noprint">&#9888; Não preencheu: '+t.falta.join(", ")+'.</div>':''))+'</div>';});
  h+='<div class="lema">Bordeaux, toujours Bordeaux.</div>';
  document.getElementById("doc").innerHTML=h;}
function copiarTudo(){var t=Array.prototype.map.call(document.querySelectorAll(".capa,.pess"),function(e){var c=e.cloneNode(true);c.querySelectorAll(".noprint,img").forEach(function(x){x.remove();});document.body.appendChild(c);var r=c.innerText;c.remove();return r.replace(/\n{3,}/g,"\n\n").trim();}).join("\n\n—\n\n");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert("Texto copiado! Cole no Word, Pages ou e-mail.");}).catch(function(){prompt("Copie o texto:",t);});}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
